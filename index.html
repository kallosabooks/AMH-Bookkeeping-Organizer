<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookkeeping Client Tracker</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --column: #e9edf2;
    --column-drop: #dde7fb;
    --border: #d6dde6;
    --border-strong: #b6c1ce;
    --text: #1f2933;
    --muted: #5f6b7a;
    --accent: #2458d6;
    --accent-hover: #1c47b0;
    --accent-soft: #e8effd;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --focus: rgba(36, 88, 214, 0.35);
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0 20px 45px rgba(16, 24, 40, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .status { font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.warn { color: var(--danger); font-weight: 600; }
  .search { position: relative; flex: 1 1 240px; max-width: 420px; }
  .search input {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); background: var(--surface); }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px 6px;
    color: var(--muted); cursor: pointer; display: none;
  }
  .search.has-text .clear { display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 550;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-strong); background: #f8fafc; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: #f1c4bf; }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.icon { padding: 5px 9px; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* ---------- Board ---------- */
  .board {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 14px;
    padding: 16px 20px 20px;
    overflow-x: auto;
    overflow-y: hidden;
    align-items: stretch;
  }
  .column {
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    background: var(--column);
    border: 2px solid transparent;
    border-radius: var(--radius);
    transition: background 0.12s, border-color 0.12s;
  }
  .column.drop-target { background: var(--column-drop); border-color: var(--accent); }
  .column-head { padding: 12px 14px 6px; }
  .column-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .column-title h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .start-badge { color: var(--accent); font-weight: 700; margin-left: 4px; cursor: help; }
  .count {
    flex: none;
    min-width: 26px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 650;
    color: var(--muted);
    text-align: center;
  }
  .sort-wrap { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .sort-select {
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .card-list {
    flex: 1;
    min-height: 70px;
    overflow-y: auto;
    padding: 4px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 2px -2px;
  }
  .empty-col {
    border: 1.5px dashed var(--border-strong);
    border-radius: 8px;
    padding: 16px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card:hover { border-color: var(--border-strong); }
  .card:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .card.dragging { opacity: 0.35; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-biz { font-weight: 650; word-break: break-word; }
  .card-name { color: var(--muted); font-size: 13.5px; margin-top: 1px; word-break: break-word; }
  .recur-icon { color: var(--accent); font-weight: 700; flex: none; cursor: help; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag.unassigned { color: var(--muted); font-weight: 500; font-style: italic; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 12px; color: var(--muted);
  }
  .pill {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 7px; white-space: nowrap;
  }
  .ghost {
    position: fixed;
    top: 0; left: 0;
    z-index: 1000;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    cursor: grabbing;
  }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

  mark { background: #fff1a8; color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 17px; word-break: break-word; }
  .modal-close { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .modal-foot .spacer { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus);
  }
  .field.invalid input { border-color: var(--danger); }
  .field-error { font-size: 12.5px; color: var(--danger); display: none; }
  .field.invalid .field-error { display: block; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  .hint { font-size: 12.5px; color: var(--muted); margin: -8px 0 14px; }

  .recur-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    background: #fbfcfe;
  }
  .recur-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .recur-line label.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .recur-line input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
  .recur-line select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .recur-line .muted { font-size: 14px; }
  .recur-box .hint { margin: 6px 0 0; }

  .section-title { font-size: 14px; font-weight: 650; margin: 8px 0 10px; }
  .note-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .note-add textarea {
    width: 100%; min-height: 80px; resize: vertical;
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  }
  .note-add textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .note-add .btn { align-self: flex-end; }
  .notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .note {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 10px 12px;
    background: #fbfcfe;
  }
  .note-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .note-text { white-space: pre-wrap; word-break: break-word; }
  .note-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 2px 4px; }
  .note-del:hover { color: var(--danger); text-decoration: underline; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .history { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .history li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #eef1f5; }
  .history li:last-child { border-bottom: 0; }
  details.more { margin-top: 18px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.more[open] summary { margin-bottom: 8px; }

  .list-edit { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .list-row { display: flex; align-items: center; gap: 6px; }
  .list-row input {
    flex: 1; min-width: 0;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  }
  .list-row input:focus, .list-add input:focus, .setting select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .list-row .n { font-size: 12px; color: var(--muted); width: 64px; text-align: right; flex: none; }
  .list-add { display: flex; gap: 8px; }
  .list-add input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .setting {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: #fbfcfe;
  }
  .setting label { font-weight: 600; font-size: 14px; }
  .setting select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }

  .backup-block { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .backup-block h3 { margin: 0 0 4px; font-size: 15px; }
  .backup-block p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .backup-block .btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2933; color: #fff; padding: 10px 16px; border-radius: 8px;
    box-shadow: var(--shadow-lg); z-index: 900; font-size: 14px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 800px) {
    .topbar { padding: 10px 14px; }
    .board { padding: 12px 14px 16px; gap: 12px; }
    .column { flex-basis: 256px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Bookkeeping Clients</h1>
      <div class="status" id="status">All changes saved in this browser</div>
    </div>
    <div class="search" id="searchWrap">
      <input type="search" id="search" placeholder="Search business, client, or accountant…" autocomplete="off" aria-label="Search clients">
      <button class="clear" id="clearSearch" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="addClientBtn" type="button">+ Add Client</button>
      <button class="btn" id="accountantsBtn" type="button">Accountants</button>
      <button class="btn" id="stagesBtn" type="button">Edit Stages</button>
      <button class="btn" id="backupBtn" type="button">Backup &amp; Restore</button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Bookkeeping board"></main>

  <input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ======================================================================
  // Data & storage
  // ======================================================================
  // The key is unchanged from the first version so existing data carries over.
  var STORAGE_KEY = 'client-onboarding-tracker-v1';
  var DEFAULT_STAGES = [
    'Bookkeeping to Start',
    'Waiting on Documents',
    'In Progress',
    'Ready for Review',
    'Complete'
  ];
  // Stages used by the first (onboarding) version, for upgrading saved data.
  var OLD_DEFAULT_STAGES = [
    'Initial Contact',
    'Consultation Scheduled',
    'Proposal Sent',
    'Contract Signed',
    'Documents Collected',
    'Account Setup',
    'Onboarding Complete'
  ];
  var SORTS = { name: 'Business A–Z', accountant: 'Accountant', age: 'Longest in stage' };
  var ACCOUNTANT_COLORS = ['#2458d6', '#0f8a5f', '#c2410c', '#7a3fd1', '#c11574', '#0e7490', '#4d7c0f', '#a16207'];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function nowISO() { return new Date().toISOString(); }

  function defaultState() {
    var stages = DEFAULT_STAGES.map(function (name) { return { id: uid(), name: name, sort: 'name' }; });
    return {
      version: 2,
      stages: stages,
      clients: [],
      accountants: [],
      settings: { recurStageId: stages[0].id }
    };
  }

  function validDate(v) {
    if (!v) return null;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }
  function str(v) { return v == null ? '' : String(v); }
  function clampDay(v) {
    var n = parseInt(v, 10);
    return n >= 1 && n <= 28 ? n : 1;
  }

  // Cleans up data loaded from storage or an imported file. Returns null if unusable.
  function normalize(data) {
    if (!data || !Array.isArray(data.stages) || !Array.isArray(data.clients)) return null;
    var seen = {};
    var stages = data.stages
      .filter(function (s) { return s && typeof s.name === 'string'; })
      .map(function (s) {
        var id = str(s.id) || uid();
        if (seen[id]) id = uid();
        seen[id] = true;
        return { id: id, name: s.name, sort: SORTS[s.sort] ? s.sort : 'name' };
      });
    if (!stages.length) return null;

    // Upgrade from the onboarding version.
    if (!data.version || data.version < 2) {
      var names = stages.map(function (s) { return s.name; });
      if (names.join('|') === OLD_DEFAULT_STAGES.join('|') && !data.clients.length) {
        stages = DEFAULT_STAGES.map(function (name) { return { id: uid(), name: name, sort: 'name' }; });
        seen = {};
        stages.forEach(function (s) { seen[s.id] = true; });
      } else if (stages[0].name === 'Initial Contact') {
        stages[0].name = DEFAULT_STAGES[0];
      }
    }

    var accSeen = {};
    var accountants = (Array.isArray(data.accountants) ? data.accountants : [])
      .filter(function (a) { return a && str(a.name).trim(); })
      .map(function (a) {
        var id = str(a.id) || uid();
        if (accSeen[id]) id = uid();
        accSeen[id] = true;
        return { id: id, name: str(a.name) };
      });

    var clients = data.clients
      .filter(function (c) { return c && typeof c === 'object'; })
      .map(function (c) {
        var stageId = seen[c.stageId] ? c.stageId : stages[0].id;
        var entered = validDate(c.stageEnteredAt) || nowISO();
        return {
          id: str(c.id) || uid(),
          business: str(c.business),
          name: str(c.name),
          accountantId: accSeen[c.accountantId] ? c.accountantId : '',
          monthly: !!c.monthly,
          recurDay: clampDay(c.recurDay),
          lastRecurAt: validDate(c.lastRecurAt),
          stageId: stageId,
          stageEnteredAt: entered,
          createdAt: validDate(c.createdAt) || entered,
          notes: (Array.isArray(c.notes) ? c.notes : [])
            .filter(function (n) { return n && str(n.text).trim(); })
            .map(function (n) {
              return { id: str(n.id) || uid(), date: validDate(n.date) || nowISO(), text: str(n.text) };
            }),
          stageHistory: (Array.isArray(c.stageHistory) ? c.stageHistory : [])
            .filter(function (h) { return h && validDate(h.date); })
            .map(function (h) {
              return { stageId: str(h.stageId), stageName: str(h.stageName), date: validDate(h.date), auto: !!h.auto };
            })
        };
      });

    var settings = data.settings || {};
    return {
      version: 2,
      stages: stages,
      clients: clients,
      accountants: accountants,
      settings: { recurStageId: seen[settings.recurStageId] ? settings.recurStageId : stages[0].id }
    };
  }

  var storageWorks = true;

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = normalize(JSON.parse(raw));
        if (parsed) return parsed;
      }
    } catch (e) {
      storageWorks = false;
    }
    return defaultState();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      storageWorks = true;
      setStatus('All changes saved in this browser', false);
    } catch (e) {
      storageWorks = false;
      setStatus('Warning: could not save. Use Backup & Restore to export your data.', true);
    }
  }

  var state = load();

  // Keep multiple open tabs in sync.
  window.addEventListener('storage', function (e) {
    if (e.key !== STORAGE_KEY || !e.newValue) return;
    try {
      var parsed = normalize(JSON.parse(e.newValue));
      if (parsed) { state = parsed; render(); }
    } catch (err) { /* ignore */ }
  });

  // ======================================================================
  // Helpers
  // ======================================================================
  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else if (k in node && k !== 'list') node[k] = v;
        else node.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child == null || child === false) continue;
      if (Array.isArray(child)) child.forEach(function (c) { if (c) node.appendChild(c); });
      else node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }
  function fmtMonth(d) {
    return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }
  function daysSince(iso) {
    var start = new Date(iso); start.setHours(0, 0, 0, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.max(0, Math.round((today - start) / 86400000));
  }
  function daysLabel(n) { return n === 0 ? 'Today' : n === 1 ? '1 day' : n + ' days'; }
  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoDay(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isoDayTime(iso) {
    var d = new Date(iso);
    return isoDay(iso) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function compareText(a, b) {
    return a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true });
  }

  function stageById(id) {
    for (var i = 0; i < state.stages.length; i++) if (state.stages[i].id === id) return state.stages[i];
    return null;
  }
  function clientById(id) {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === id) return state.clients[i];
    return null;
  }
  function accountantById(id) {
    for (var i = 0; i < state.accountants.length; i++) if (state.accountants[i].id === id) return state.accountants[i];
    return null;
  }
  function accountantColor(id) {
    for (var i = 0; i < state.accountants.length; i++) {
      if (state.accountants[i].id === id) return ACCOUNTANT_COLORS[i % ACCOUNTANT_COLORS.length];
    }
    return '#98a2b3';
  }
  function accountantName(client) {
    var a = accountantById(client.accountantId);
    return a ? a.name : '';
  }
  function displayName(client) { return client.business || client.name || 'Unnamed client'; }
  function recurStage() { return stageById(state.settings.recurStageId) || state.stages[0]; }

  function sortClients(list, sort) {
    return list.slice().sort(function (a, b) {
      if (sort === 'age') {
        if (a.stageEnteredAt !== b.stageEnteredAt) return a.stageEnteredAt < b.stageEnteredAt ? -1 : 1;
      } else if (sort === 'accountant') {
        var an = accountantName(a), bn = accountantName(b);
        if (!an !== !bn) return an ? -1 : 1; // unassigned last
        var byAcc = compareText(an, bn);
        if (byAcc) return byAcc;
      }
      return compareText(displayName(a), displayName(b));
    });
  }
  function clientsIn(stage) {
    return sortClients(state.clients.filter(function (c) { return c.stageId === stage.id; }), stage.sort);
  }

  var statusEl = document.getElementById('status');
  function setStatus(text, warn) {
    statusEl.textContent = text;
    statusEl.classList.toggle('warn', !!warn);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3000);
  }

  // Highlights the search term inside text.
  function highlight(text, term) {
    var frag = document.createDocumentFragment();
    if (!term) { frag.appendChild(document.createTextNode(text)); return frag; }
    var lower = text.toLowerCase();
    var pos = 0, idx;
    while ((idx = lower.indexOf(term, pos)) !== -1) {
      if (idx > pos) frag.appendChild(document.createTextNode(text.slice(pos, idx)));
      frag.appendChild(el('mark', { text: text.slice(idx, idx + term.length) }));
      pos = idx + term.length;
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    return frag;
  }

  // ======================================================================
  // Actions
  // ======================================================================
  function moveClient(client, stageId, auto) {
    if (!client || client.stageId === stageId || !stageById(stageId)) return false;
    client.stageId = stageId;
    client.stageEnteredAt = nowISO();
    client.stageHistory.push({ stageId: stageId, stageName: stageById(stageId).name, date: client.stageEnteredAt, auto: !!auto });
    return true;
  }

  function addNote(client, text) {
    text = text.trim();
    if (!text) return false;
    client.notes.push({ id: uid(), date: nowISO(), text: text });
    return true;
  }

  function setMonthly(client, on) {
    client.monthly = !!on;
    // Start counting from now so turning it on doesn't trigger an immediate restart.
    if (on) client.lastRecurAt = nowISO();
  }

  function addAccountant(name) {
    name = str(name).trim();
    if (!name) return null;
    for (var i = 0; i < state.accountants.length; i++) {
      if (state.accountants[i].name.toLowerCase() === name.toLowerCase()) return state.accountants[i];
    }
    var a = { id: uid(), name: name };
    state.accountants.push(a);
    return a;
  }

  // ======================================================================
  // Monthly recurrence
  //   On each client's chosen day of the month, monthly clients move back
  //   to the "restart" stage (Bookkeeping to Start by default).
  // ======================================================================
  function lastOccurrence(day, now) {
    var d = new Date(now.getFullYear(), now.getMonth(), day);
    if (d > now) d = new Date(now.getFullYear(), now.getMonth() - 1, day);
    return d;
  }

  function runRecurrences() {
    var now = new Date();
    var target = recurStage();
    var finalStage = state.stages[state.stages.length - 1];
    var moved = 0, changed = false;
    state.clients.forEach(function (c) {
      if (!c.monthly) return;
      var occ = lastOccurrence(c.recurDay, now);
      if (!c.lastRecurAt) { c.lastRecurAt = nowISO(); changed = true; return; }
      if (new Date(c.lastRecurAt) >= occ) return;
      var prev = stageById(c.stageId);
      if (c.stageId !== target.id) {
        if (prev && prev.id !== finalStage.id) {
          addNote(c, 'Automatic monthly restart for ' + fmtMonth(occ) + '. This client was still in "' + prev.name +
            '", so check that the previous month was finished.');
        }
        moveClient(c, target.id, true);
        moved++;
      }
      c.lastRecurAt = nowISO();
      changed = true;
    });
    if (changed) save();
    if (moved) toast(moved + (moved === 1 ? ' monthly client' : ' monthly clients') + ' moved to ' + target.name);
    return changed;
  }

  // ======================================================================
  // Rendering the board
  // ======================================================================
  var boardEl = document.getElementById('board');
  var searchEl = document.getElementById('search');
  var searchWrap = document.getElementById('searchWrap');

  function searchTerm() { return searchEl.value.trim().toLowerCase(); }

  function matches(client, term) {
    if (!term) return true;
    return client.name.toLowerCase().indexOf(term) !== -1 ||
           client.business.toLowerCase().indexOf(term) !== -1 ||
           accountantName(client).toLowerCase().indexOf(term) !== -1;
  }

  function renderCard(client, term) {
    var days = daysSince(client.stageEnteredAt);
    var noteCount = client.notes.length;
    var acc = accountantById(client.accountantId);
    return el('div', {
      class: 'card',
      tabindex: '0',
      role: 'button',
      'data-id': client.id,
      'aria-label': displayName(client) + (client.name && client.business ? ', ' + client.name : '') +
        (acc ? ', accountant ' + acc.name : '') + '. Open details'
    },
      el('div', { class: 'card-top' },
        el('div', { class: 'card-biz' }, highlight(displayName(client), term)),
        client.monthly ? el('span', { class: 'recur-icon', title: 'Repeats monthly on the ' + ordinal(client.recurDay), text: '↻' }) : null
      ),
      client.name && client.business ? el('div', { class: 'card-name' }, highlight(client.name, term)) : null,
      el('div', { class: 'card-tags' },
        acc
          ? el('span', { class: 'tag', title: 'Accountant' },
              el('span', { class: 'dot', style: 'background:' + accountantColor(acc.id) }),
              highlight(acc.name, term))
          : el('span', { class: 'tag unassigned', text: 'Unassigned' })
      ),
      el('div', { class: 'card-meta' },
        el('span', { title: 'Date the client entered this stage', text: 'Since ' + fmtDate(client.stageEnteredAt) }),
        el('span', { class: 'pill', text: daysLabel(days) + (noteCount ? ' · ' + noteCount + (noteCount === 1 ? ' note' : ' notes') : '') })
      )
    );
  }

  function render() {
    var term = searchTerm();
    var scroll = boardEl.scrollLeft;
    var listScroll = {};
    boardEl.querySelectorAll('.column').forEach(function (col) {
      listScroll[col.getAttribute('data-stage')] = col.querySelector('.card-list').scrollTop;
    });
    var startId = recurStage().id;

    boardEl.textContent = '';
    state.stages.forEach(function (stage) {
      var all = clientsIn(stage);
      var visible = all.filter(function (c) { return matches(c, term); });
      var list = el('div', { class: 'card-list' });
      var lastGroup = null;
      visible.forEach(function (c) {
        if (stage.sort === 'accountant') {
          var group = c.accountantId && accountantById(c.accountantId) ? c.accountantId : '';
          if (group !== lastGroup) {
            lastGroup = group;
            list.appendChild(el('div', { class: 'group-label' },
              el('span', { class: 'dot', style: 'background:' + accountantColor(group) }),
              group ? accountantById(group).name : 'Unassigned'));
          }
        }
        list.appendChild(renderCard(c, term));
      });
      if (!visible.length) {
        list.appendChild(el('div', { class: 'empty-col', text: term && all.length ? 'No matches' : 'Drag clients here' }));
      }

      var sortSel = el('select', { class: 'sort-select', 'data-stage': stage.id, 'aria-label': 'Sort ' + stage.name });
      Object.keys(SORTS).forEach(function (k) {
        sortSel.appendChild(el('option', { value: k, text: SORTS[k], selected: stage.sort === k }));
      });

      var col = el('section', { class: 'column', 'data-stage': stage.id, 'aria-label': stage.name },
        el('div', { class: 'column-head' },
          el('div', { class: 'column-title' },
            el('h2', {},
              stage.name,
              stage.id === startId && state.clients.some(function (c) { return c.monthly; })
                ? el('span', { class: 'start-badge', title: 'Monthly clients return to this stage each month', text: '↻' })
                : null
            ),
            el('span', { class: 'count', title: term ? 'Matching / total clients' : 'Clients in this stage',
              text: term ? visible.length + ' / ' + all.length : String(all.length) })
          ),
          el('label', { class: 'sort-wrap' }, 'Sort:', sortSel)
        ),
        list
      );
      boardEl.appendChild(col);
      if (listScroll[stage.id]) list.scrollTop = listScroll[stage.id];
    });
    boardEl.scrollLeft = scroll;
  }

  boardEl.addEventListener('change', function (e) {
    if (!e.target.classList.contains('sort-select')) return;
    var stage = stageById(e.target.getAttribute('data-stage'));
    if (!stage) return;
    stage.sort = e.target.value;
    save();
    render();
  });

  searchEl.addEventListener('input', function () {
    searchWrap.classList.toggle('has-text', !!searchEl.value);
    render();
  });
  document.getElementById('clearSearch').addEventListener('click', function () {
    searchEl.value = '';
    searchWrap.classList.remove('has-text');
    render();
    searchEl.focus();
  });

  // ======================================================================
  // Drag and drop (works with mouse, pen and touch)
  //   Mouse: press and move.  Touch: press and hold briefly, then move.
  // ======================================================================
  var drag = null;
  var suppressClick = false;

  boardEl.addEventListener('pointerdown', function (e) {
    var card = e.target.closest('.card');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = {
      card: card,
      id: card.getAttribute('data-id'),
      type: e.pointerType,
      startX: e.clientX, startY: e.clientY,
      x: e.clientX, y: e.clientY,
      active: false, ghost: null, target: null, timer: null, raf: null
    };
    if (e.pointerType === 'touch') {
      drag.timer = setTimeout(function () {
        if (drag && !drag.active) startDrag();
      }, 300);
    }
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active) {
      var dist = Math.hypot(drag.x - drag.startX, drag.y - drag.startY);
      if (drag.type === 'touch') {
        if (dist > 10) cancelDrag(); // user is scrolling, not dragging
        return;
      }
      if (dist < 6) return;
      startDrag();
    }
    updateDrag();
  });

  document.addEventListener('pointerup', function () {
    if (!drag) return;
    if (drag.active) finishDrag(); else cancelDrag();
  });
  document.addEventListener('pointercancel', function () { if (drag) cancelDrag(); });

  // Stop the page from scrolling while a touch drag is in progress.
  document.addEventListener('touchmove', function (e) {
    if (drag && drag.active) e.preventDefault();
  }, { passive: false });

  function startDrag() {
    var rect = drag.card.getBoundingClientRect();
    drag.active = true;
    drag.offsetX = drag.startX - rect.left;
    drag.offsetY = drag.startY - rect.top;
    var ghost = drag.card.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = rect.width + 'px';
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.card.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (navigator.vibrate && drag.type === 'touch') { try { navigator.vibrate(15); } catch (err) { /* ignore */ } }
    updateDrag();
    autoScroll();
  }

  function updateDrag() {
    if (!drag || !drag.active) return;
    drag.ghost.style.transform = 'translate(' + (drag.x - drag.offsetX) + 'px,' + (drag.y - drag.offsetY) + 'px) rotate(2deg)';
    var under = document.elementFromPoint(drag.x, drag.y);
    var col = under ? under.closest('.column') : null;
    if (col !== drag.target) {
      if (drag.target) drag.target.classList.remove('drop-target');
      drag.target = col;
      if (col) col.classList.add('drop-target');
    }
  }

  // Scroll the board sideways (and columns up/down) when dragging near an edge.
  function autoScroll() {
    if (!drag || !drag.active) return;
    var r = boardEl.getBoundingClientRect();
    var edge = 60, speed = 14;
    if (drag.x < r.left + edge) boardEl.scrollLeft -= speed;
    else if (drag.x > r.right - edge) boardEl.scrollLeft += speed;
    if (drag.target) {
      var list = drag.target.querySelector('.card-list');
      var lr = list.getBoundingClientRect();
      if (drag.y < lr.top + 30) list.scrollTop -= 10;
      else if (drag.y > lr.bottom - 30) list.scrollTop += 10;
    }
    updateDrag();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function cleanupDrag() {
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.raf) cancelAnimationFrame(drag.raf);
    if (drag.ghost) drag.ghost.remove();
    if (drag.target) drag.target.classList.remove('drop-target');
    drag.card.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    drag = null;
  }
  function cancelDrag() { cleanupDrag(); }

  function finishDrag() {
    var client = clientById(drag.id);
    var stageId = drag.target ? drag.target.getAttribute('data-stage') : null;
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 50);
    cleanupDrag();
    if (client && stageId && moveClient(client, stageId)) {
      save();
      render();
      toast(displayName(client) + ' moved to ' + stageById(stageId).name);
    }
  }

  boardEl.addEventListener('click', function (e) {
    if (suppressClick) return;
    var card = e.target.closest('.card');
    if (card) openClient(card.getAttribute('data-id'));
  });
  boardEl.addEventListener('keydown', function (e) {
    var card = e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openClient(card.getAttribute('data-id'));
    }
  });
  boardEl.addEventListener('contextmenu', function (e) {
    if (e.target.closest('.card') && (drag || e.pointerType === 'touch')) e.preventDefault();
  });

  // ======================================================================
  // Modal
  // ======================================================================
  var currentModal = null;

  function openModal(opts) {
    closeModal(true);
    var overlay = el('div', { class: 'overlay' });
    var closeBtn = el('button', { class: 'modal-close', type: 'button', 'aria-label': 'Close', text: '×' });
    var titleEl = el('h2', { text: opts.title });
    var modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title },
      el('div', { class: 'modal-head' }, titleEl, closeBtn),
      el('div', { class: 'modal-body' }, opts.body),
      opts.footer ? el('div', { class: 'modal-foot' }, opts.footer) : null
    );
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    currentModal = { overlay: overlay, titleEl: titleEl, onClose: opts.onClose, lastFocus: document.activeElement };

    closeBtn.addEventListener('click', function () { closeModal(); });
    var downOnOverlay = false;
    overlay.addEventListener('pointerdown', function (e) { downOnOverlay = e.target === overlay; });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay && downOnOverlay) closeModal();
    });
    var focusTarget = opts.focus || modal.querySelector('input, textarea, select, button');
    if (focusTarget) setTimeout(function () { focusTarget.focus(); }, 0);
  }

  function closeModal(silent) {
    if (!currentModal) return;
    var m = currentModal;
    currentModal = null;
    if (!silent && m.onClose) m.onClose();
    m.overlay.remove();
    if (m.lastFocus && m.lastFocus.focus && document.contains(m.lastFocus)) m.lastFocus.focus();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && currentModal) { e.preventDefault(); closeModal(); }
    // "/" focuses search when not typing
    if (e.key === '/' && !currentModal && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault(); searchEl.focus();
    }
  });

  function stageSelect(selectedId) {
    var sel = el('select');
    state.stages.forEach(function (s) {
      sel.appendChild(el('option', { value: s.id, text: s.name, selected: s.id === selectedId }));
    });
    return sel;
  }

  // Accountant drop-down with an "add new" option at the bottom.
  function accountantSelect(selectedId, onChange) {
    var sel = el('select');
    function fill(selected) {
      sel.textContent = '';
      sel.appendChild(el('option', { value: '', text: '— Unassigned —' }));
      state.accountants.slice().sort(function (a, b) { return compareText(a.name, b.name); }).forEach(function (a) {
        sel.appendChild(el('option', { value: a.id, text: a.name }));
      });
      sel.appendChild(el('option', { value: '__new', text: '+ Add new accountant…' }));
      sel.value = accountantById(selected) ? selected : '';
      sel.dataset.current = sel.value;
    }
    fill(selectedId);
    sel.addEventListener('change', function () {
      if (sel.value === '__new') {
        var name = prompt('New accountant name:');
        var a = addAccountant(name);
        if (a) { save(); render(); fill(a.id); }
        else sel.value = sel.dataset.current;
      }
      sel.dataset.current = sel.value;
      if (onChange) onChange(sel.value);
    });
    return sel;
  }

  function dayOptions(selected) {
    var sel = el('select', { 'aria-label': 'Day of the month' });
    for (var d = 1; d <= 28; d++) sel.appendChild(el('option', { value: String(d), text: ordinal(d), selected: d === selected }));
    return sel;
  }

  // Checkbox + day picker used on both the add and edit screens.
  function recurControls(monthly, day, onChange) {
    var box = el('input', { type: 'checkbox', checked: monthly });
    var daySel = dayOptions(day);
    var hint = el('p', { class: 'hint' });
    function refresh() {
      daySel.disabled = !box.checked;
      hint.textContent = box.checked
        ? 'On the ' + ordinal(+daySel.value) + ' of every month, this client automatically moves back to "' + recurStage().name + '".'
        : 'Turn this on for clients whose books you do every month.';
    }
    box.addEventListener('change', function () { refresh(); if (onChange) onChange(box.checked, +daySel.value); });
    daySel.addEventListener('change', function () { refresh(); if (onChange) onChange(box.checked, +daySel.value); });
    refresh();
    return {
      box: box, daySel: daySel,
      node: el('div', { class: 'recur-box' },
        el('div', { class: 'recur-line' },
          el('label', { class: 'check' }, box, 'Repeats monthly'),
          el('span', { class: 'muted' }, 'on the'), daySel, el('span', { class: 'muted' }, 'of each month')
        ),
        hint
      )
    };
  }

  function field(labelText, input, id, required) {
    input.id = id;
    return el('div', { class: 'field' },
      el('label', { for: id }, labelText, required ? el('span', { class: 'req', text: ' *' }) : null),
      input,
      required ? el('div', { class: 'field-error', text: labelText + ' is required.' }) : null
    );
  }

  // ---------- Add client ----------
  function openAddClient() {
    var business = el('input', { type: 'text', maxLength: 200, placeholder: 'e.g. Smith Consulting LLC', required: true });
    var name = el('input', { type: 'text', maxLength: 200, placeholder: 'e.g. Jane Smith' });
    var accountant = accountantSelect('');
    var stage = stageSelect(recurStage().id);
    var recur = recurControls(true, 1);
    var notes = el('textarea', { placeholder: 'Anything worth remembering about this client…' });
    var createBtn = el('button', { class: 'btn primary', type: 'button', text: 'Add Client' });
    var businessField = field('Business Name', business, 'f-biz', true);

    business.addEventListener('input', function () {
      if (business.value.trim()) businessField.classList.remove('invalid');
    });

    function create() {
      if (!business.value.trim()) {
        businessField.classList.add('invalid');
        business.focus();
        return;
      }
      var now = nowISO();
      var client = {
        id: uid(),
        business: business.value.trim(),
        name: name.value.trim(),
        accountantId: accountant.value === '__new' ? '' : accountant.value,
        monthly: false,
        recurDay: +recur.daySel.value,
        lastRecurAt: null,
        stageId: stage.value,
        stageEnteredAt: now,
        createdAt: now,
        notes: [],
        stageHistory: [{ stageId: stage.value, stageName: stageById(stage.value).name, date: now, auto: false }]
      };
      setMonthly(client, recur.box.checked);
      addNote(client, notes.value);
      state.clients.push(client);
      save();
      render();
      closeModal(true);
      toast(client.business + ' added');
    }
    createBtn.addEventListener('click', create);
    [business, name].forEach(function (i) {
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
    });

    openModal({
      title: 'Add Client',
      focus: business,
      body: [
        el('div', { class: 'row' },
          businessField,
          field('Client / Contact Name', name, 'f-name')
        ),
        el('div', { class: 'row' },
          field('Accountant', accountant, 'f-acc'),
          field('Starting Stage', stage, 'f-stage')
        ),
        recur.node,
        field('Notes', notes, 'f-notes'),
        el('p', { class: 'hint', text: 'Notes are saved with today\'s date. You can add more dated notes later.' })
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { closeModal(true); } }),
        createBtn
      ]
    });
  }

  // ---------- View / edit client ----------
  function openClient(id) {
    var client = clientById(id);
    if (!client) return;

    var business = el('input', { type: 'text', maxLength: 200, value: client.business, required: true });
    var name = el('input', { type: 'text', maxLength: 200, value: client.name });
    var businessField = field('Business Name', business, 'e-biz', true);
    var accountant = accountantSelect(client.accountantId, function (v) {
      client.accountantId = v;
      save(); render();
    });
    var stage = stageSelect(client.stageId);
    var recur = recurControls(client.monthly, client.recurDay, function (on, day) {
      if (on !== client.monthly) setMonthly(client, on);
      client.recurDay = day;
      save(); render(); refreshSince();
    });
    var sinceText = el('p', { class: 'hint' });
    var noteInput = el('textarea', { placeholder: 'Write an update… (saved with today\'s date)' });
    var notesList = el('ul', { class: 'notes' });
    var historyList = el('ul', { class: 'history' });

    function refreshSince() {
      var d = daysSince(client.stageEnteredAt);
      sinceText.textContent = 'In this stage since ' + fmtDate(client.stageEnteredAt) +
        ' (' + (d === 0 ? 'today' : daysLabel(d)) + '). Client added ' + fmtDate(client.createdAt) + '.';
    }

    function refreshNotes() {
      notesList.textContent = '';
      if (!client.notes.length) {
        notesList.appendChild(el('li', { class: 'muted', text: 'No notes yet.' }));
        return;
      }
      client.notes.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (n) {
        notesList.appendChild(el('li', { class: 'note' },
          el('div', { class: 'note-head' },
            el('span', { text: fmtDateTime(n.date) }),
            el('button', { class: 'note-del', type: 'button', text: 'Delete', onclick: function () {
              if (!confirm('Delete this note from ' + fmtDateTime(n.date) + '?')) return;
              client.notes = client.notes.filter(function (x) { return x.id !== n.id; });
              save(); render(); refreshNotes();
            } })
          ),
          el('div', { class: 'note-text', text: n.text })
        ));
      });
    }

    function refreshHistory() {
      historyList.textContent = '';
      var items = client.stageHistory.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (!items.length) {
        historyList.appendChild(el('li', { class: 'muted', text: 'No stage changes recorded yet.' }));
        return;
      }
      items.forEach(function (h) {
        var s = stageById(h.stageId);
        historyList.appendChild(el('li', {},
          el('span', { text: (s ? s.name : (h.stageName || 'Removed stage')) + (h.auto ? ' (monthly restart)' : '') }),
          el('span', { class: 'muted', text: fmtDateTime(h.date) })
        ));
      });
    }

    business.addEventListener('input', function () {
      var v = business.value.trim();
      businessField.classList.toggle('invalid', !v);
      if (!v) return; // keep the last saved name until a new one is typed
      client.business = v;
      if (currentModal) currentModal.titleEl.textContent = v;
      save(); render();
    });
    name.addEventListener('input', function () {
      client.name = name.value.trim();
      save(); render();
    });
    stage.addEventListener('change', function () {
      if (moveClient(client, stage.value)) {
        save(); render(); refreshSince(); refreshHistory();
        toast('Moved to ' + stageById(stage.value).name);
      }
    });

    var addNoteBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Add Note', onclick: function () {
      if (addNote(client, noteInput.value)) {
        noteInput.value = '';
        save(); render(); refreshNotes();
      } else {
        noteInput.focus();
      }
    } });
    noteInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addNoteBtn.click();
    });

    refreshSince(); refreshNotes(); refreshHistory();

    openModal({
      title: displayName(client),
      body: [
        el('div', { class: 'row' },
          businessField,
          field('Client / Contact Name', name, 'e-name')
        ),
        el('div', { class: 'row' },
          field('Accountant', accountant, 'e-acc'),
          field('Stage', stage, 'e-stage')
        ),
        sinceText,
        recur.node,
        el('div', { class: 'section-title', text: 'Notes' }),
        el('div', { class: 'note-add' }, noteInput, addNoteBtn),
        notesList,
        el('details', { class: 'more' },
          el('summary', { text: 'Stage history' }),
          historyList
        )
      ],
      footer: [
        el('button', { class: 'btn danger', type: 'button', text: 'Delete Client', onclick: function () {
          var label = displayName(client);
          if (!confirm('Delete ' + label + ' and all of their notes?\n\nThis cannot be undone.')) return;
          state.clients = state.clients.filter(function (c) { return c.id !== client.id; });
          save(); render();
          closeModal(true);
          toast(label + ' deleted');
        } }),
        el('div', { class: 'spacer' }),
        el('span', { class: 'muted', text: 'Changes save automatically' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ],
      focus: business,
      onClose: function () {
        // Don't lose a note that was typed but not added.
        if (noteInput.value.trim()) {
          addNote(client, noteInput.value);
          save(); render();
          toast('Your unsaved note was added');
        }
      }
    });
  }

  // ---------- Accountants ----------
  function openAccountants() {
    var list = el('ul', { class: 'list-edit' });
    var newName = el('input', { type: 'text', placeholder: 'Accountant name', maxLength: 100, 'aria-label': 'New accountant name' });

    function refresh() {
      list.textContent = '';
      if (!state.accountants.length) {
        list.appendChild(el('li', { class: 'muted', text: 'No accountants yet. Add your team below.' }));
      }
      state.accountants.forEach(function (a) {
        var count = state.clients.filter(function (c) { return c.accountantId === a.id; }).length;
        var input = el('input', { type: 'text', value: a.name, maxLength: 100, 'aria-label': 'Accountant name' });
        input.addEventListener('input', function () {
          if (!input.value.trim()) return;
          a.name = input.value.trim();
          save(); render();
        });
        input.addEventListener('blur', function () { input.value = a.name; });
        list.appendChild(el('li', { class: 'list-row' },
          el('span', { class: 'dot', style: 'background:' + accountantColor(a.id) }),
          input,
          el('span', { class: 'n', text: count + (count === 1 ? ' client' : ' clients') }),
          el('button', { class: 'btn icon small danger', type: 'button', title: 'Remove accountant', 'aria-label': 'Remove ' + a.name,
            text: '✕', onclick: function () {
              var msg = 'Remove ' + a.name + '?' +
                (count ? '\n\nTheir ' + count + (count === 1 ? ' client' : ' clients') + ' will become Unassigned.' : '');
              if (!confirm(msg)) return;
              state.clients.forEach(function (c) { if (c.accountantId === a.id) c.accountantId = ''; });
              state.accountants = state.accountants.filter(function (x) { return x.id !== a.id; });
              save(); render(); refresh();
            } })
        ));
      });
    }

    function add() {
      if (!newName.value.trim()) { newName.focus(); return; }
      addAccountant(newName.value);
      newName.value = '';
      save(); render(); refresh();
      newName.focus();
    }
    newName.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });

    refresh();
    openModal({
      title: 'Accountants',
      focus: newName,
      body: [
        el('p', { class: 'muted', style: 'margin-top:0', text: 'These names appear in the Accountant drop-down on each client. Edit a name to rename it everywhere.' }),
        list,
        el('div', { class: 'list-add' },
          newName,
          el('button', { class: 'btn primary', type: 'button', text: 'Add Accountant', onclick: add })
        )
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ]
    });
  }

  // ---------- Edit stages ----------
  function openStages() {
    var list = el('ul', { class: 'list-edit' });
    var newName = el('input', { type: 'text', placeholder: 'New stage name', maxLength: 100, 'aria-label': 'New stage name' });
    var restartSel = el('select', { id: 'restart-stage' });
    restartSel.addEventListener('change', function () {
      state.settings.recurStageId = restartSel.value;
      save(); render();
    });

    function refresh() {
      restartSel.textContent = '';
      state.stages.forEach(function (s) {
        restartSel.appendChild(el('option', { value: s.id, text: s.name, selected: s.id === recurStage().id }));
      });

      list.textContent = '';
      state.stages.forEach(function (s, i) {
        var count = state.clients.filter(function (c) { return c.stageId === s.id; }).length;
        var input = el('input', { type: 'text', value: s.name, maxLength: 100, 'aria-label': 'Stage name' });
        input.addEventListener('input', function () {
          s.name = input.value;
          restartSel.options[i].textContent = s.name;
          save(); render();
        });
        input.addEventListener('blur', function () {
          if (!input.value.trim()) { s.name = 'Untitled stage'; input.value = s.name; save(); render(); refresh(); }
        });
        list.appendChild(el('li', { class: 'list-row' },
          el('button', { class: 'btn icon small', type: 'button', title: 'Move left', 'aria-label': 'Move ' + s.name + ' earlier',
            text: '↑', disabled: i === 0, onclick: function () { moveStage(i, -1); } }),
          el('button', { class: 'btn icon small', type: 'button', title: 'Move right', 'aria-label': 'Move ' + s.name + ' later',
            text: '↓', disabled: i === state.stages.length - 1, onclick: function () { moveStage(i, 1); } }),
          input,
          el('span', { class: 'n', text: count + (count === 1 ? ' client' : ' clients') }),
          el('button', { class: 'btn icon small danger', type: 'button', title: 'Remove stage', 'aria-label': 'Remove ' + s.name,
            text: '✕', disabled: state.stages.length === 1, onclick: function () { removeStage(i); } })
        ));
      });
    }

    function moveStage(i, dir) {
      var j = i + dir;
      if (j < 0 || j >= state.stages.length) return;
      var tmp = state.stages[i];
      state.stages[i] = state.stages[j];
      state.stages[j] = tmp;
      save(); render(); refresh();
    }

    function removeStage(i) {
      var s = state.stages[i];
      var inStage = state.clients.filter(function (c) { return c.stageId === s.id; });
      if (state.stages.length === 1) return;
      var fallback = state.stages[i > 0 ? i - 1 : 1];
      var msg = inStage.length
        ? 'Remove the stage "' + s.name + '"?\n\nIts ' + inStage.length + (inStage.length === 1 ? ' client' : ' clients') +
          ' will be moved to "' + fallback.name + '".'
        : 'Remove the stage "' + s.name + '"?';
      if (s.id === recurStage().id) msg += '\n\nMonthly clients will restart in "' + fallback.name + '" instead.';
      if (!confirm(msg)) return;
      inStage.forEach(function (c) { moveClient(c, fallback.id); });
      if (s.id === recurStage().id) state.settings.recurStageId = fallback.id;
      state.stages.splice(i, 1);
      save(); render(); refresh();
    }

    function addStage() {
      var n = newName.value.trim();
      if (!n) { newName.focus(); return; }
      state.stages.push({ id: uid(), name: n, sort: 'name' });
      newName.value = '';
      save(); render(); refresh();
      boardEl.scrollLeft = boardEl.scrollWidth;
      newName.focus();
    }
    newName.addEventListener('keydown', function (e) { if (e.key === 'Enter') addStage(); });

    refresh();
    openModal({
      title: 'Edit Stages',
      focus: newName,
      body: [
        el('div', { class: 'setting' },
          el('label', { for: 'restart-stage', text: 'Monthly clients restart in:' }),
          restartSel
        ),
        el('p', { class: 'muted', style: 'margin-top:0', text: 'Rename a stage by editing its name. Use the arrows to change the order (top = leftmost column).' }),
        list,
        el('div', { class: 'list-add' },
          newName,
          el('button', { class: 'btn primary', type: 'button', text: 'Add Stage', onclick: addStage })
        )
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ]
    });
  }

  // ======================================================================
  // Backup & restore (JSON = full backup, CSV = spreadsheet friendly)
  // ======================================================================
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function stamp() { return isoDay(nowISO()); }

  function exportJSON() {
    var data = {
      app: 'client-onboarding-tracker', exportedAt: nowISO(), version: 2,
      stages: state.stages, accountants: state.accountants, settings: state.settings, clients: state.clients
    };
    download('bookkeeping-backup-' + stamp() + '.json', JSON.stringify(data, null, 2), 'application/json');
    toast('Backup downloaded');
  }

  var CSV_HEADERS = ['Business Name', 'Client Name', 'Accountant', 'Stage', 'Monthly', 'Monthly Day',
    'Entered Stage', 'Client Added', 'Notes'];

  function csvCell(v) {
    v = str(v);
    return /[",\r\n]/.test(v) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function exportCSV() {
    var rows = [CSV_HEADERS];
    state.stages.forEach(function (s) {
      clientsIn(s).forEach(function (c) {
        var notes = c.notes.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })
          .map(function (n) { return '[' + isoDayTime(n.date) + '] ' + n.text; }).join('\n');
        rows.push([c.business, c.name, accountantName(c), s.name, c.monthly ? 'Yes' : 'No', c.recurDay,
          isoDay(c.stageEnteredAt), isoDay(c.createdAt), notes]);
      });
    });
    var text = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    download('bookkeeping-clients-' + stamp() + '.csv', text, 'text/csv');
    toast('CSV downloaded');
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else inQuotes = false;
        } else cell += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ''; }); });
  }

  // "2026-09-23" or "2026-09-23 14:05" as a local date/time
  function parseLocalDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(str(s).trim());
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 12), +(m[5] || 0)).toISOString();
    return validDate(s);
  }

  function parseNotes(text) {
    var notes = [];
    str(text).split(/\r?\n/).forEach(function (line) {
      var m = /^\[(\d{4}-\d{2}-\d{2}(?: \d{1,2}:\d{2})?)\]\s?(.*)$/.exec(line);
      if (m) notes.push({ id: uid(), date: parseLocalDate(m[1]) || nowISO(), text: m[2] });
      else if (notes.length) notes[notes.length - 1].text += '\n' + line;
      else if (line.trim()) notes.push({ id: uid(), date: nowISO(), text: line });
    });
    notes.forEach(function (n) { n.text = n.text.replace(/\s+$/, ''); });
    return notes.filter(function (n) { return n.text.trim(); });
  }

  function stateFromCSV(text) {
    var rows = parseCSV(text.replace(/^﻿/, ''));
    if (rows.length < 1) throw new Error('The CSV file is empty.');
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    function col(name) { return header.indexOf(name.toLowerCase()); }
    var iBiz = col('Business Name'), iName = col('Client Name'), iAcc = col('Accountant'), iStage = col('Stage'),
        iMonthly = col('Monthly'), iDay = col('Monthly Day'),
        iEntered = col('Entered Stage'), iAdded = col('Client Added'), iNotes = col('Notes');
    if (iBiz === -1 && iName === -1) throw new Error('Could not find a "Business Name" column.');

    // Keep the current stages and accountants, adding any new names found in the file.
    var stages = state.stages.map(function (s) { return { id: s.id, name: s.name, sort: s.sort }; });
    var accountants = state.accountants.map(function (a) { return { id: a.id, name: a.name }; });
    function findOrAdd(list, name, extra) {
      name = str(name).trim();
      for (var i = 0; i < list.length; i++) if (list[i].name.toLowerCase() === name.toLowerCase()) return list[i].id;
      var item = { id: uid(), name: name };
      if (extra) Object.keys(extra).forEach(function (k) { item[k] = extra[k]; });
      list.push(item);
      return item.id;
    }

    var now = nowISO();
    var clients = rows.slice(1).map(function (r) {
      function get(i) { return i === -1 ? '' : str(r[i]).trim(); }
      var stageName = get(iStage);
      var stageId = stageName ? findOrAdd(stages, stageName, { sort: 'name' }) : stages[0].id;
      var accName = get(iAcc);
      var entered = parseLocalDate(get(iEntered)) || now;
      return {
        id: uid(),
        business: get(iBiz) || get(iName),
        name: get(iBiz) ? get(iName) : '',
        accountantId: accName ? findOrAdd(accountants, accName) : '',
        monthly: /^(y|yes|true|1|x)$/i.test(get(iMonthly)),
        recurDay: clampDay(get(iDay)),
        lastRecurAt: now,
        stageId: stageId,
        stageEnteredAt: entered,
        createdAt: parseLocalDate(get(iAdded)) || entered,
        notes: iNotes === -1 ? [] : parseNotes(r[iNotes]),
        stageHistory: [{ stageId: stageId, stageName: '', date: entered }]
      };
    }).filter(function (c) { return c.business; });

    return normalize({ version: 2, stages: stages, accountants: accountants, settings: state.settings, clients: clients });
  }

  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result).replace(/^﻿/, '');
      var isJSON = /\.json$/i.test(file.name) || /^\s*[\{\[]/.test(text);
      var next;
      try {
        if (isJSON) {
          next = normalize(JSON.parse(text));
          if (!next) throw new Error('This file does not look like a tracker backup.');
        } else {
          next = stateFromCSV(text);
        }
      } catch (err) {
        alert('Could not import "' + file.name + '".\n\n' + (err && err.message ? err.message : err));
        return;
      }
      var msg = 'Import ' + next.clients.length + (next.clients.length === 1 ? ' client' : ' clients') +
        ' from "' + file.name + '"?\n\nThis will REPLACE all clients currently on your board' +
        (isJSON ? ', your stages and your accountants' : '') + '. Consider exporting a backup first.';
      if (!confirm(msg)) return;
      state = next;
      save();
      render();
      closeModal(true);
      toast('Imported ' + next.clients.length + ' clients');
    };
    reader.onerror = function () { alert('Could not read that file.'); };
    reader.readAsText(file);
  }

  var fileInput = document.getElementById('importFile');
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) importFile(fileInput.files[0]);
    fileInput.value = '';
  });

  function openBackup() {
    openModal({
      title: 'Backup & Restore',
      body: [
        el('p', { class: 'muted', style: 'margin-top:0',
          text: 'Your data is saved automatically in this browser on this computer. Download a backup regularly, especially before clearing your browser history or switching computers.' }),
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Export' }),
          el('p', { text: 'JSON is a complete backup (stages, accountants, clients, all dated notes and stage history). CSV opens in Excel or Google Sheets.' }),
          el('div', { class: 'btns' },
            el('button', { class: 'btn primary', type: 'button', text: 'Download Backup (JSON)', onclick: exportJSON }),
            el('button', { class: 'btn', type: 'button', text: 'Download Spreadsheet (CSV)', onclick: exportCSV })
          )
        ),
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Import' }),
          el('p', { text: 'Restore from a JSON backup or a CSV file exported from this app. Importing replaces the clients currently on your board (you will be asked to confirm).' }),
          el('div', { class: 'btns' },
            el('button', { class: 'btn', type: 'button', text: 'Choose File to Import…', onclick: function () { fileInput.click(); } })
          )
        )
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn', type: 'button', text: 'Close', onclick: function () { closeModal(); } })
      ]
    });
  }

  // ======================================================================
  // Wire up & start
  // ======================================================================
  document.getElementById('addClientBtn').addEventListener('click', openAddClient);
  document.getElementById('accountantsBtn').addEventListener('click', openAccountants);
  document.getElementById('stagesBtn').addEventListener('click', openStages);
  document.getElementById('backupBtn').addEventListener('click', openBackup);

  if (!storageWorks) setStatus('Warning: this browser is blocking saving. Use Backup & Restore to keep your data.', true);
  else save();
  runRecurrences();
  render();

  // Check for monthly restarts and refresh "days in stage" if the page stays open.
  function tick() {
    if (drag) return;
    runRecurrences();
    if (!currentModal) render();
  }
  setInterval(tick, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
})();
</script>
