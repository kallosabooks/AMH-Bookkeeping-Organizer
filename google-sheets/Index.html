<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookkeeping Clients</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --column: #e9edf2;
    --column-drop: #dde7fb;
    --border: #d6dde6;
    --border-strong: #b6c1ce;
    --text: #1f2933;
    --muted: #5f6b7a;
    --accent: #2458d6;
    --accent-hover: #1c47b0;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --focus: rgba(36, 88, 214, 0.35);
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0 20px 45px rgba(16, 24, 40, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .status { font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.warn { color: var(--danger); font-weight: 600; }
  .search { position: relative; flex: 1 1 240px; max-width: 420px; }
  .search input {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); background: var(--surface); }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px 6px;
    color: var(--muted); cursor: pointer; display: none;
  }
  .search.has-text .clear { display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }


  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 550;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--border-strong); background: #f8fafc; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); border-color: #f1c4bf; }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.icon { padding: 5px 9px; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* ---------- Board ---------- */
  .board {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 14px;
    padding: 16px 20px 20px;
    overflow-x: auto;
    overflow-y: hidden;
    align-items: stretch;
  }
  .loading { margin: auto; color: var(--muted); text-align: center; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 10px;
    border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .column {
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    background: var(--column);
    border: 2px solid transparent;
    border-radius: var(--radius);
    transition: background 0.12s, border-color 0.12s;
  }
  .column.drop-target { background: var(--column-drop); border-color: var(--accent); }
  .column-head { padding: 12px 14px 6px; }
  .column-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .column-title h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .start-badge { color: var(--accent); font-weight: 700; margin-left: 4px; cursor: help; }
  .count {
    flex: none;
    min-width: 26px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 650;
    color: var(--muted);
    text-align: center;
  }
  .sort-wrap { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .sort-select {
    font-size: 12px;
    padding: 2px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .card-list {
    flex: 1;
    min-height: 70px;
    overflow-y: auto;
    padding: 4px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted);
    margin: 4px 2px -2px;
  }
  .empty-col {
    border: 1.5px dashed var(--border-strong);
    border-radius: 8px;
    padding: 16px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .card:hover { border-color: var(--border-strong); }
  .card:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .card.dragging { opacity: 0.35; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-biz { font-weight: 650; word-break: break-word; }
  .card-name { color: var(--muted); font-size: 13.5px; margin-top: 1px; word-break: break-word; }
  .recur-icon { color: var(--accent); font-weight: 700; flex: none; cursor: help; }
  .month-chip {
    flex: none; font-size: 12px; font-weight: 700; white-space: nowrap;
    padding: 1px 8px; border-radius: 6px;
    background: var(--accent-soft, #e8effd); color: var(--accent);
  }
  .month-chip.multi { background: #fff1e0; color: #b45309; }
  .months-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .months-list li {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .months-list li.current { border-color: var(--accent); background: #f5f8ff; }
  .months-list .spacer { flex: 1; }
  .clients-search { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
  .clients-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .client-list { border: 1px solid var(--border); border-radius: 8px; }
  .client-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px; border-bottom: 1px solid #eef1f5; }
  .client-row:last-child { border-bottom: 0; }
  .client-main { flex: 1 1 260px; min-width: 0; }
  .client-months { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
  .ask-select { width: 100%; margin-top: 12px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag.unassigned { color: var(--muted); font-weight: 500; font-style: italic; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 12px; color: var(--muted);
  }
  .pill {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 7px; white-space: nowrap;
  }
  .ghost {
    position: fixed;
    top: 0; left: 0;
    z-index: 1000;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    cursor: grabbing;
  }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

  mark { background: #fff1a8; color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .overlay.ask { z-index: 700; }
  .modal {
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
  }
  .overlay.ask .modal { max-width: 440px; }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 17px; word-break: break-word; }
  .modal-close { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
  .modal-body { padding: 18px 20px; overflow-y: auto; }
  .modal-body .ask-msg { margin: 0; white-space: pre-line; }
  .modal-body .ask-input { width: 100%; margin-top: 12px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; }
  .modal-body .ask-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .modal-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .modal-foot .spacer { flex: 1; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .req { color: var(--danger); }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus);
  }
  .field.invalid input { border-color: var(--danger); }
  .field-error { font-size: 12.5px; color: var(--danger); display: none; }
  .field.invalid .field-error { display: block; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  .hint { font-size: 12.5px; color: var(--muted); margin: -8px 0 14px; }

  .recur-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    background: #fbfcfe;
  }
  .recur-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .recur-line label.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .recur-line input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
  .recur-line select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .recur-line .muted { font-size: 14px; }
  .recur-box .hint { margin: 6px 0 0; }

  .section-title { font-size: 14px; font-weight: 650; margin: 8px 0 10px; }
  .note-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .note-add textarea {
    width: 100%; min-height: 80px; resize: vertical;
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  }
  .note-add textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .note-add .btn { align-self: flex-end; }
  .notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .note {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 10px 12px;
    background: #fbfcfe;
  }
  .note.auto { border-left-color: #c2410c; }
  .note.pending { opacity: 0.6; }
  .note-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .note-text { white-space: pre-wrap; word-break: break-word; }
  .note-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 2px 4px; }
  .note-del:hover { color: var(--danger); text-decoration: underline; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .history { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .history li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #eef1f5; }
  .history li:last-child { border-bottom: 0; }
  details.more { margin-top: 18px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.more[open] summary { margin-bottom: 8px; }

  .list-edit { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .list-row { display: flex; align-items: center; gap: 6px; }
  .list-row input {
    flex: 1; min-width: 0;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  }
  .list-row input:focus, .list-add input:focus, .setting select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .list-row .n { font-size: 12px; color: var(--muted); width: 64px; text-align: right; flex: none; }
  .list-add { display: flex; gap: 8px; }
  .list-add input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .setting {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: #fbfcfe;
  }
  .setting label { font-weight: 600; font-size: 14px; }
  .setting select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }

  .backup-block { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .backup-block h3 { margin: 0 0 4px; font-size: 15px; }
  .backup-block p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .backup-block .btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .modal.wide { max-width: 1060px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -6px 0 16px; }
  .tab {
    border: 0; background: none; cursor: pointer;
    padding: 8px 14px; margin-bottom: -1px;
    font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); border-radius: 6px 6px 0 0; }

  .checklist-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .checklist-bar .year { font-weight: 700; font-size: 16px; min-width: 52px; text-align: center; }
  .checklist-bar .spacer { flex: 1; }
  .checklist-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
  table.checklist { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
  .checklist th, .checklist td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #eef1f5; }
  .checklist tbody tr:last-child td { border-bottom: 0; }
  .checklist th { background: #f8fafc; font-size: 13px; font-weight: 650; }
  .checklist .task {
    position: sticky; left: 0; z-index: 1;
    text-align: left; padding-left: 12px;
    min-width: 170px; max-width: 260px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .checklist th.task { background: #f8fafc; }
  .checklist .work { background: #eef4ff; }
  .checklist th.work { background: #dde7fb; }
  .checklist .mcount { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .checklist th.full .mcount { color: #0f7a50; font-weight: 700; }
  .checklist input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
  .checklist input:disabled { cursor: default; }
  .checklist-empty { padding: 18px; text-align: center; color: var(--muted); }
  .month-title { font-weight: 700; font-size: 16px; }
  .year-nav { display: inline-flex; align-items: center; gap: 8px; margin-left: 8px; }
  .year-nav[hidden] { display: none; }
  table.checklist.single td { text-align: left; padding: 8px 10px; }
  table.checklist.single td.box { width: 36px; text-align: center; }
  table.checklist.single td.name label { cursor: pointer; display: block; }
  table.checklist.single td.who { width: 200px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  table.checklist.single tr.done td.name { color: var(--muted); }
  .checklist-empty .btn { margin-top: 10px; }
  .task-editor { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; background: #fbfcfe; }
  .task-editor h3 { margin: 0 0 10px; font-size: 14px; }
  .task-editor .list-edit { margin-bottom: 10px; }
  .task-editor .list-add { margin-bottom: 10px; }
  .pill.progress { font-size: 12px; font-weight: 600; padding: 1px 8px; }
  .pill.progress.done { background: #e7f6ee; border-color: #a7dcc0; color: #0f6b47; }
  .import-form { display: flex; flex-wrap: wrap; gap: 8px; }
  .import-form input { flex: 1 1 260px; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .import-form select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .import-form input:focus, .import-form select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2933; color: #fff; padding: 10px 16px; border-radius: 8px;
    box-shadow: var(--shadow-lg); z-index: 900; font-size: 14px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }

  @media (max-width: 800px) {
    .topbar { padding: 10px 14px; }
    .board { padding: 12px 14px 16px; gap: 12px; }
    .column { flex-basis: 256px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Bookkeeping Clients</h1>
      <div class="status" id="status">Connecting…</div>
    </div>
    <div class="search" id="searchWrap">
      <input type="search" id="search" placeholder="Search business, client, or accountant…" autocomplete="off" aria-label="Search clients">
      <button class="clear" id="clearSearch" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="addClientBtn" type="button" disabled>+ Add Client</button>
      <button class="btn" id="clientsBtn" type="button" disabled>Clients</button>
      <button class="btn" id="accountantsBtn" type="button" disabled>Accountants</button>
      <button class="btn" id="templateBtn" type="button" disabled>Checklist Template</button>
      <button class="btn" id="stagesBtn" type="button" disabled>Edit Stages</button>
      <button class="btn" id="backupBtn" type="button" disabled>Backup &amp; Restore</button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Bookkeeping board">
    <div class="loading"><div class="spinner"></div>Loading the board…</div>
  </main>

  <input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var SORTS = { name: 'Business A–Z', accountant: 'Accountant', age: 'Longest in stage' };
  var ACCOUNTANT_COLORS = ['#2458d6', '#0f8a5f', '#c2410c', '#7a3fd1', '#c11574', '#0e7490', '#4d7c0f', '#a16207'];
  var POLL_MS = 15000;

  // Board data from the server: { rev, me, sheetUrl, stages: [names], accountants: [names],
  //   restartStage, template, clients: [{ id, business, name, accountant, monthly, recurDay,
  //   createdAt, lastRecurAt, cards: [{ id, month, stage, enteredAt, onBoard }], notes, history,
  //   tasks, checks }] }
  // A client has one card on the board per month being worked on (month "" for
  // clients that aren't monthly).
  var state = null;

  // ======================================================================
  // Talking to the server (Code.gs)
  // ======================================================================
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }

  var pending = 0;
  var queue = Promise.resolve();

  // Sends one change. `optimistic` updates the screen straight away; the
  // server's answer then replaces the board with the saved version.
  function send(op, args, optimistic) {
    if (optimistic) {
      try { optimistic(); } catch (e) { /* the server answer will correct it */ }
      render();
      if (currentModal && currentModal.refresh) currentModal.refresh();
    }
    pending++;
    setStatus('Saving…');
    var result = queue.then(function () { return call('mutate', op, args); });
    queue = result.then(function (json) {
      pending--;
      if (!pending) applyServer(JSON.parse(json));
    }, function (err) {
      pending--;
      showError(err);
      if (!pending) refresh();
    });
    result.catch(function () { /* reported above */ });
    return result;
  }

  function refresh() {
    return call('getState').then(function (json) {
      if (!pending) applyServer(JSON.parse(json));
    }, function (err) {
      if (!state) showFatal(err); else showError(err);
    });
  }

  function applyServer(s) {
    var first = !state;
    state = s;
    setStatus(connectedText());
    if (first) {
      ['addClientBtn', 'clientsBtn', 'accountantsBtn', 'templateBtn', 'stagesBtn', 'backupBtn'].forEach(function (id) {
        document.getElementById(id).disabled = false;
      });
    }
    if (drag) return; // re-render after the drag finishes
    render();
    if (currentModal && currentModal.refresh) currentModal.refresh();
  }

  function connectedText() {
    return (state && state.me ? 'Signed in as ' + state.me + ' · ' : '') + 'All changes saved';
  }

  // Check for other people's changes.
  setInterval(function () {
    if (!state || document.hidden || pending || drag) return;
    call('getRev').then(function (rev) {
      if (rev !== state.rev && !pending) refresh();
    }, function () {
      setStatus('Connection problem — retrying…', true);
    });
  }, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state && !pending) refresh();
  });

  function errText(err) {
    return (err && err.message ? err.message : String(err || 'Something went wrong')).replace(/^Exception:\s*/, '');
  }
  function showError(err) {
    toast(errText(err), true);
    setStatus(connectedText());
  }
  function showFatal(err) {
    var msg = errText(err);
    boardEl.textContent = '';
    boardEl.appendChild(el('div', { class: 'loading' },
      el('p', { style: 'font-weight:600;color:var(--text)', text: 'The board could not be loaded.' }),
      el('p', { text: msg }),
      el('button', { class: 'btn primary', type: 'button', text: 'Try again', onclick: function () { location.reload(); } })
    ));
    setStatus('Not connected', true);
  }

  // ======================================================================
  // Helpers
  // ======================================================================
  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
        else if (k in node && k !== 'list') node[k] = v;
        else node.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child == null || child === false) continue;
      if (Array.isArray(child)) child.forEach(function (c) { if (c) node.appendChild(c); });
      else node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  function uid() { return 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function nowISO() { return new Date().toISOString(); }
  function str(v) { return v == null ? '' : String(v); }
  function validDate(v) {
    if (!v) return null;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d.toISOString();
  }
  function clampDay(v) {
    var n = parseInt(v, 10);
    return n >= 1 && n <= 28 ? n : 1;
  }
  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString(undefined, {
      month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }
  function daysSince(iso) {
    var start = new Date(iso); start.setHours(0, 0, 0, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.max(0, Math.round((today - start) / 86400000));
  }
  function daysLabel(n) { return n === 0 ? 'Today' : n === 1 ? '1 day' : n + ' days'; }
  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoDay(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isoDayTime(iso) {
    var d = new Date(iso);
    return isoDay(iso) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function compareText(a, b) {
    return a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true });
  }
  function shortName(email) { return str(email).split('@')[0]; }

  var MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
    'October', 'November', 'December'];
  function monthKey(year, index) { return year + '-' + pad(index + 1); }

  // The month being worked on: bookkeeping for a month happens during the next one.
  function workMonth() {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - 1);
    return { year: d.getFullYear(), index: d.getMonth(), key: monthKey(d.getFullYear(), d.getMonth()) };
  }

  // Checkmarks for one client and year. The board carries recent years; older
  // years are fetched when opened and kept here.
  var olderChecks = {};
  function checksFor(c, year) {
    if (!state.checksFrom || monthKey(year, 11) >= state.checksFrom) return c.checks;
    return olderChecks[c.id + '|' + year] || null;
  }
  function doneCount(c, key) {
    return c.tasks.filter(function (t) { return c.checks[t.id + '|' + key]; }).length;
  }
  // "2026-08" -> "Aug 2026" (or "August 2026" when long)
  function monthLabel(key, long) {
    if (!key) return '';
    var i = +key.slice(5, 7) - 1;
    return (long ? MONTH_LONG[i] : MONTH_SHORT[i]) + ' ' + key.slice(0, 4);
  }
  // The month a card is for; cards without one follow the calendar.
  function cardMonth(k) {
    if (k && k.month) return { year: +k.month.slice(0, 4), index: +k.month.slice(5, 7) - 1, key: k.month };
    return workMonth();
  }
  function addMonths(key, n) {
    var d = new Date(+key.slice(0, 4), +key.slice(5, 7) - 1 + n, 1);
    return monthKey(d.getFullYear(), d.getMonth());
  }

  function clientById(id) {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === id) return state.clients[i];
    return null;
  }
  // Finds a card by id: { c: client, k: card }
  function cardById(id) {
    for (var i = 0; i < state.clients.length; i++) {
      var c = state.clients[i];
      for (var j = 0; j < c.cards.length; j++) if (c.cards[j].id === id) return { c: c, k: c.cards[j] };
    }
    return null;
  }
  function findClientByName(business) {
    var key = str(business).trim().toLowerCase();
    return state.clients.filter(function (c) { return c.business.toLowerCase() === key; })[0] || null;
  }
  // Opens a client at its most recent month on the board, or on its own if it has none.
  function openExisting(c) {
    var cards = boardCards(c);
    openClient(cards.length ? cards[cards.length - 1].id : null, c.id);
  }
  function boardCards(c) {
    return c.cards.filter(function (k) { return k.onBoard; })
      .sort(function (a, b) { return a.month < b.month ? -1 : a.month > b.month ? 1 : 0; });
  }
  function accountantColor(name) {
    var i = state.accountants.indexOf(name);
    return i === -1 ? '#98a2b3' : ACCOUNTANT_COLORS[i % ACCOUNTANT_COLORS.length];
  }
  function displayName(c) { return c.business || c.name || 'Unnamed client'; }
  function restartStage() {
    return state.stages.indexOf(state.restartStage) !== -1 ? state.restartStage : state.stages[0];
  }
  function sortedAccountants() {
    return state.accountants.slice().sort(compareText);
  }

  // Each person's sort choice per column is remembered on their own computer.
  var SORT_KEY = 'bookkeeping-tracker-sorts';
  var sortPrefs = {};
  try { sortPrefs = JSON.parse(localStorage.getItem(SORT_KEY)) || {}; } catch (e) { sortPrefs = {}; }
  function sortFor(stage) { return SORTS[sortPrefs[stage]] ? sortPrefs[stage] : 'name'; }
  function setSort(stage, sort) {
    sortPrefs[stage] = sort;
    try { localStorage.setItem(SORT_KEY, JSON.stringify(sortPrefs)); } catch (e) { /* ignore */ }
  }

  // Sorts board entries ({ c, k }) for one column.
  function sortEntries(list, sort) {
    return list.slice().sort(function (x, y) {
      var a = x.c, b = y.c;
      if (sort === 'age') {
        if (x.k.enteredAt !== y.k.enteredAt) return x.k.enteredAt < y.k.enteredAt ? -1 : 1;
      } else if (sort === 'accountant') {
        if (!a.accountant !== !b.accountant) return a.accountant ? -1 : 1; // unassigned last
        var byAcc = compareText(a.accountant, b.accountant);
        if (byAcc) return byAcc;
      }
      return compareText(displayName(a), displayName(b)) || (x.k.month < y.k.month ? -1 : x.k.month > y.k.month ? 1 : 0);
    });
  }
  function entriesIn(stage) {
    var out = [];
    state.clients.forEach(function (c) {
      c.cards.forEach(function (k) { if (k.onBoard && k.stage === stage) out.push({ c: c, k: k }); });
    });
    return sortEntries(out, sortFor(stage));
  }
  function countIn(stage) { return entriesIn(stage).length; }

  var statusEl = document.getElementById('status');
  function setStatus(text, warn) {
    statusEl.textContent = text;
    statusEl.classList.toggle('warn', !!warn);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isError);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, isError ? 6000 : 3000);
  }

  function highlight(text, term) {
    var frag = document.createDocumentFragment();
    if (!term) { frag.appendChild(document.createTextNode(text)); return frag; }
    var lower = text.toLowerCase();
    var pos = 0, idx;
    while ((idx = lower.indexOf(term, pos)) !== -1) {
      if (idx > pos) frag.appendChild(document.createTextNode(text.slice(pos, idx)));
      frag.appendChild(el('mark', { text: text.slice(idx, idx + term.length) }));
      pos = idx + term.length;
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    return frag;
  }

  // Local (on-screen) versions of changes, shown before the server confirms.
  function localMove(c, k, stage) {
    k.stage = stage;
    k.enteredAt = nowISO();
    c.history.push({ stage: stage, date: k.enteredAt, by: state.me, auto: false, month: k.month });
  }

  // ======================================================================
  // Rendering the board
  // ======================================================================
  var boardEl = document.getElementById('board');
  var searchEl = document.getElementById('search');
  var searchWrap = document.getElementById('searchWrap');

  function searchTerm() { return searchEl.value.trim().toLowerCase(); }

  function matches(c, term) {
    if (!term) return true;
    return c.name.toLowerCase().indexOf(term) !== -1 ||
           c.business.toLowerCase().indexOf(term) !== -1 ||
           c.accountant.toLowerCase().indexOf(term) !== -1;
  }

  function renderCard(c, k, term) {
    var days = daysSince(k.enteredAt);
    var noteCount = c.notes.length;
    var others = boardCards(c).length > 1;
    return el('div', {
      class: 'card',
      tabindex: '0',
      role: 'button',
      'data-id': k.id,
      'aria-label': displayName(c) + (k.month ? ', ' + monthLabel(k.month, true) : '') + (c.name ? ', ' + c.name : '') +
        (c.accountant ? ', accountant ' + c.accountant : '') + '. Open details'
    },
      el('div', { class: 'card-top' },
        el('div', { class: 'card-biz' }, highlight(displayName(c), term)),
        k.month
          ? el('span', { class: 'month-chip' + (others ? ' multi' : ''),
              title: monthLabel(k.month, true) + (others ? ' · this client has more than one month on the board' : ''),
              text: monthLabel(k.month) })
          : (c.monthly ? el('span', { class: 'recur-icon', title: 'Repeats monthly on the ' + ordinal(c.recurDay), text: '↻' }) : null)
      ),
      c.name ? el('div', { class: 'card-name' }, highlight(c.name, term)) : null,
      el('div', { class: 'card-tags' },
        c.accountant
          ? el('span', { class: 'tag', title: 'Accountant' },
              el('span', { class: 'dot', style: 'background:' + accountantColor(c.accountant) }),
              highlight(c.accountant, term))
          : el('span', { class: 'tag unassigned', text: 'Unassigned' }),
        progressPill(c, k)
      ),
      el('div', { class: 'card-meta' },
        el('span', { title: 'Date this card entered this stage', text: 'Since ' + fmtDate(k.enteredAt) }),
        el('span', { class: 'pill', text: daysLabel(days) + (noteCount ? ' · ' + noteCount + (noteCount === 1 ? ' note' : ' notes') : '') })
      )
    );
  }

  function progressPill(c, k) {
    if (!c.tasks.length) return null;
    var wm = cardMonth(k);
    var done = doneCount(c, wm.key);
    return el('span', {
      class: 'pill progress' + (done === c.tasks.length ? ' done' : ''),
      title: MONTH_LONG[wm.index] + ' ' + wm.year + ' checklist: ' + done + ' of ' + c.tasks.length + ' done',
      text: (done === c.tasks.length ? '✓ ' : '') + done + '/' + c.tasks.length + ' done'
    });
  }

  function render() {
    if (!state) return;
    var term = searchTerm();
    var scroll = boardEl.scrollLeft;
    var listScroll = {};
    boardEl.querySelectorAll('.column').forEach(function (col) {
      listScroll[col.getAttribute('data-stage')] = col.querySelector('.card-list').scrollTop;
    });
    var start = restartStage();
    var anyMonthly = state.clients.some(function (c) { return c.monthly; });

    boardEl.textContent = '';
    state.stages.forEach(function (stage) {
      var sort = sortFor(stage);
      var all = entriesIn(stage);
      var visible = all.filter(function (e) { return matches(e.c, term); });
      var list = el('div', { class: 'card-list' });
      var lastGroup = null;
      visible.forEach(function (e) {
        var c = e.c;
        if (sort === 'accountant' && c.accountant !== lastGroup) {
          lastGroup = c.accountant;
          list.appendChild(el('div', { class: 'group-label' },
            el('span', { class: 'dot', style: 'background:' + accountantColor(c.accountant) }),
            c.accountant || 'Unassigned'));
        }
        list.appendChild(renderCard(c, e.k, term));
      });
      if (!visible.length) {
        list.appendChild(el('div', { class: 'empty-col', text: term && all.length ? 'No matches' : 'Drag clients here' }));
      }

      var sortSel = el('select', { class: 'sort-select', 'aria-label': 'Sort ' + stage });
      sortSel.setAttribute('data-stage', stage);
      Object.keys(SORTS).forEach(function (k) {
        sortSel.appendChild(el('option', { value: k, text: SORTS[k], selected: sort === k }));
      });

      var col = el('section', { class: 'column', 'aria-label': stage },
        el('div', { class: 'column-head' },
          el('div', { class: 'column-title' },
            el('h2', {},
              stage,
              stage === start && anyMonthly
                ? el('span', { class: 'start-badge', title: 'Monthly clients return to this stage each month', text: '↻' })
                : null
            ),
            el('span', { class: 'count', title: term ? 'Matching / total clients' : 'Clients in this stage',
              text: term ? visible.length + ' / ' + all.length : String(all.length) })
          ),
          el('label', { class: 'sort-wrap' }, 'Sort:', sortSel)
        ),
        list
      );
      col.setAttribute('data-stage', stage);
      boardEl.appendChild(col);
      if (listScroll[stage]) list.scrollTop = listScroll[stage];
    });
    boardEl.scrollLeft = scroll;
  }

  boardEl.addEventListener('change', function (e) {
    if (!e.target.classList.contains('sort-select')) return;
    setSort(e.target.getAttribute('data-stage'), e.target.value);
    render();
  });

  searchEl.addEventListener('input', function () {
    searchWrap.classList.toggle('has-text', !!searchEl.value);
    render();
  });
  document.getElementById('clearSearch').addEventListener('click', function () {
    searchEl.value = '';
    searchWrap.classList.remove('has-text');
    render();
    searchEl.focus();
  });

  // ======================================================================
  // Drag and drop (works with mouse, pen and touch)
  //   Mouse: press and move.  Touch: press and hold briefly, then move.
  // ======================================================================
  var drag = null;
  var suppressClick = false;

  boardEl.addEventListener('pointerdown', function (e) {
    var card = e.target.closest('.card');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = {
      card: card,
      id: card.getAttribute('data-id'),
      type: e.pointerType,
      startX: e.clientX, startY: e.clientY,
      x: e.clientX, y: e.clientY,
      active: false, ghost: null, target: null, timer: null, raf: null
    };
    if (e.pointerType === 'touch') {
      drag.timer = setTimeout(function () {
        if (drag && !drag.active) startDrag();
      }, 300);
    }
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active) {
      var dist = Math.hypot(drag.x - drag.startX, drag.y - drag.startY);
      if (drag.type === 'touch') {
        if (dist > 10) cleanupDrag(); // user is scrolling, not dragging
        return;
      }
      if (dist < 6) return;
      startDrag();
    }
    updateDrag();
  });

  document.addEventListener('pointerup', function () {
    if (!drag) return;
    if (drag.active) finishDrag(); else cleanupDrag();
  });
  document.addEventListener('pointercancel', function () { if (drag) { cleanupDrag(); render(); } });

  // Stop the page from scrolling while a touch drag is in progress.
  document.addEventListener('touchmove', function (e) {
    if (drag && drag.active) e.preventDefault();
  }, { passive: false });

  function startDrag() {
    var rect = drag.card.getBoundingClientRect();
    drag.active = true;
    drag.offsetX = drag.startX - rect.left;
    drag.offsetY = drag.startY - rect.top;
    var ghost = drag.card.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = rect.width + 'px';
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.card.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (navigator.vibrate && drag.type === 'touch') { try { navigator.vibrate(15); } catch (err) { /* ignore */ } }
    updateDrag();
    autoScroll();
  }

  function updateDrag() {
    if (!drag || !drag.active) return;
    drag.ghost.style.transform = 'translate(' + (drag.x - drag.offsetX) + 'px,' + (drag.y - drag.offsetY) + 'px) rotate(2deg)';
    var under = document.elementFromPoint(drag.x, drag.y);
    var col = under ? under.closest('.column') : null;
    if (col !== drag.target) {
      if (drag.target) drag.target.classList.remove('drop-target');
      drag.target = col;
      if (col) col.classList.add('drop-target');
    }
  }

  function autoScroll() {
    if (!drag || !drag.active) return;
    var r = boardEl.getBoundingClientRect();
    var edge = 60, speed = 14;
    if (drag.x < r.left + edge) boardEl.scrollLeft -= speed;
    else if (drag.x > r.right - edge) boardEl.scrollLeft += speed;
    if (drag.target) {
      var list = drag.target.querySelector('.card-list');
      var lr = list.getBoundingClientRect();
      if (drag.y < lr.top + 30) list.scrollTop -= 10;
      else if (drag.y > lr.bottom - 30) list.scrollTop += 10;
    }
    updateDrag();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function cleanupDrag() {
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.raf) cancelAnimationFrame(drag.raf);
    if (drag.ghost) drag.ghost.remove();
    if (drag.target) drag.target.classList.remove('drop-target');
    drag.card.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    drag = null;
  }

  function finishDrag() {
    var found = cardById(drag.id);
    var stage = drag.target ? drag.target.getAttribute('data-stage') : null;
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 50);
    cleanupDrag();
    if (found && stage && found.k.stage !== stage) {
      send('moveCard', { id: found.k.id, stage: stage }, function () { localMove(found.c, found.k, stage); });
      toast(displayName(found.c) + (found.k.month ? ' (' + monthLabel(found.k.month) + ')' : '') + ' moved to ' + stage);
    } else {
      render();
    }
  }

  boardEl.addEventListener('click', function (e) {
    if (suppressClick) return;
    var card = e.target.closest('.card');
    if (card) openClient(card.getAttribute('data-id'));
  });
  boardEl.addEventListener('keydown', function (e) {
    var card = e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openClient(card.getAttribute('data-id'));
    }
  });
  boardEl.addEventListener('contextmenu', function (e) {
    if (e.target.closest('.card') && drag) e.preventDefault();
  });

  // ======================================================================
  // Modals and confirmation dialogs
  // ======================================================================
  var currentModal = null;
  var currentAsk = null;

  function buildModal(title, body, footer, extraClass) {
    var overlay = el('div', { class: 'overlay' + (extraClass ? ' ' + extraClass : '') });
    var closeBtn = el('button', { class: 'modal-close', type: 'button', 'aria-label': 'Close', text: '×' });
    var titleEl = el('h2', { text: title });
    var modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('div', { class: 'modal-head' }, titleEl, closeBtn),
      el('div', { class: 'modal-body' }, body),
      footer ? el('div', { class: 'modal-foot' }, footer) : null
    );
    overlay.appendChild(modal);
    return { overlay: overlay, modal: modal, titleEl: titleEl, closeBtn: closeBtn };
  }

  function openModal(opts) {
    closeModal(true);
    var b = buildModal(opts.title, opts.body, opts.footer);
    if (opts.wide) b.modal.classList.add('wide');
    document.body.appendChild(b.overlay);
    currentModal = { overlay: b.overlay, titleEl: b.titleEl, onClose: opts.onClose, refresh: opts.refresh,
      lastFocus: document.activeElement };
    b.closeBtn.addEventListener('click', function () { closeModal(); });
    var downOnOverlay = false;
    b.overlay.addEventListener('pointerdown', function (e) { downOnOverlay = e.target === b.overlay; });
    b.overlay.addEventListener('click', function (e) {
      if (e.target === b.overlay && downOnOverlay) closeModal();
    });
    var focusTarget = opts.focus || b.modal.querySelector('input, textarea, select, button');
    if (focusTarget) setTimeout(function () { focusTarget.focus(); }, 0);
  }

  function closeModal(silent) {
    if (!currentModal) return;
    var m = currentModal;
    currentModal = null;
    if (!silent && m.onClose) m.onClose();
    m.overlay.remove();
    if (m.lastFocus && m.lastFocus.focus && document.contains(m.lastFocus)) m.lastFocus.focus();
  }

  // A small confirm / prompt dialog. Resolves true (confirm), the typed text (prompt), or null.
  function ask(opts) {
    if (currentAsk) currentAsk.finish(null);
    return new Promise(function (resolve) {
      var input = opts.input ? el('input', { class: 'ask-input', type: 'text', maxLength: 100, placeholder: opts.placeholder || '' }) : null;
      var select = null;
      if (opts.options) {
        select = el('select', { class: 'ask-select' });
        opts.options.forEach(function (o) {
          select.appendChild(el('option', { value: o.value, text: o.text, selected: o.value === opts.value }));
        });
      }
      var okBtn = el('button', { class: 'btn ' + (opts.danger ? 'danger-solid' : 'primary'), type: 'button', text: opts.okText || 'OK' });
      var cancelBtn = el('button', { class: 'btn', type: 'button', text: 'Cancel' });
      var b = buildModal(opts.title, [el('p', { class: 'ask-msg', text: opts.message || '' }), input, select],
        [el('div', { class: 'spacer' }), cancelBtn, okBtn], 'ask');
      var lastFocus = document.activeElement;
      document.body.appendChild(b.overlay);
      function finish(value) {
        if (!currentAsk) return;
        currentAsk = null;
        b.overlay.remove();
        if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
        resolve(value);
      }
      currentAsk = { finish: finish };
      function ok() {
        if (input) {
          if (!input.value.trim()) { input.focus(); return; }
          finish(input.value.trim());
        } else if (select) {
          finish(select.value);
        } else finish(true);
      }
      okBtn.addEventListener('click', ok);
      cancelBtn.addEventListener('click', function () { finish(null); });
      b.closeBtn.addEventListener('click', function () { finish(null); });
      if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
      setTimeout(function () { (input || select || okBtn).focus(); }, 0);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (currentAsk) { e.preventDefault(); currentAsk.finish(null); return; }
      if (currentModal) { e.preventDefault(); closeModal(); return; }
    }
    if (e.key === '/' && state && !currentModal && !currentAsk &&
        !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault(); searchEl.focus();
    }
  });

  function stageSelect(selected) {
    var sel = el('select');
    fillStageSelect(sel, selected);
    return sel;
  }
  function fillStageSelect(sel, selected) {
    sel.textContent = '';
    state.stages.forEach(function (s) {
      sel.appendChild(el('option', { value: s, text: s, selected: s === selected }));
    });
  }

  // Accountant drop-down with an "add new" option at the bottom.
  function accountantSelect(selected, onChange) {
    var sel = el('select');
    var current = selected || '';
    function fill(value) {
      sel.textContent = '';
      sel.appendChild(el('option', { value: '', text: '— Unassigned —' }));
      var names = sortedAccountants();
      if (value && names.indexOf(value) === -1) names.push(value);
      names.forEach(function (a) { sel.appendChild(el('option', { value: a, text: a })); });
      sel.appendChild(el('option', { value: '__new', text: '+ Add new accountant…' }));
      sel.value = value || '';
      current = sel.value;
    }
    fill(current);
    sel.addEventListener('change', function () {
      if (sel.value !== '__new') {
        current = sel.value;
        if (onChange) onChange(current);
        return;
      }
      sel.value = current;
      ask({ title: 'Add Accountant', message: 'Name of the new accountant:', input: true, okText: 'Add' }).then(function (name) {
        if (!name) return;
        if (state.accountants.indexOf(name) === -1) {
          send('addAccountant', { name: name }, function () { state.accountants.push(name); });
        }
        fill(name);
        if (onChange) onChange(name);
      });
    });
    sel.refill = function () { if (document.activeElement !== sel) fill(current); };
    return sel;
  }

  function dayOptions(selected) {
    var sel = el('select', { 'aria-label': 'Day of the month' });
    for (var d = 1; d <= 28; d++) sel.appendChild(el('option', { value: String(d), text: ordinal(d), selected: d === selected }));
    return sel;
  }

  function recurControls(monthly, day, onChange) {
    var box = el('input', { type: 'checkbox', checked: monthly });
    var daySel = dayOptions(day);
    var hint = el('p', { class: 'hint' });
    function refresh() {
      daySel.disabled = !box.checked;
      hint.textContent = box.checked
        ? 'On the ' + ordinal(+daySel.value) + ' of every month, a card for the month just ended is added to "' + restartStage() + '" (e.g. on Sept ' + ordinal(+daySel.value) + ', one for August). Earlier months stay where they are until finished. If last month is still in "' + restartStage() + '", the new card waits until it moves on.'
        : 'Turn this on for clients whose books you do every month.';
    }
    box.addEventListener('change', function () { refresh(); if (onChange) onChange({ monthly: box.checked }); });
    daySel.addEventListener('change', function () { refresh(); if (onChange) onChange({ recurDay: +daySel.value }); });
    refresh();
    return {
      box: box, daySel: daySel,
      set: function (m, d) { box.checked = m; daySel.value = String(d); refresh(); },
      node: el('div', { class: 'recur-box' },
        el('div', { class: 'recur-line' },
          el('label', { class: 'check' }, box, 'Repeats monthly'),
          el('span', { class: 'muted' }, 'on the'), daySel, el('span', { class: 'muted' }, 'of each month')
        ),
        hint
      )
    };
  }

  function field(labelText, input, id, required) {
    input.id = id;
    return el('div', { class: 'field' },
      el('label', { for: id }, labelText, required ? el('span', { class: 'req', text: ' *' }) : null),
      input,
      required ? el('div', { class: 'field-error', text: labelText + ' is required.' }) : null
    );
  }

  // A drop-down of months around now. `skip` leaves out months already on the board.
  function monthSelect(selected, allowNone, skip) {
    var sel = el('select');
    if (allowNone) sel.appendChild(el('option', { value: '', text: 'No particular month' }));
    monthChoices(skip).forEach(function (o) {
      sel.appendChild(el('option', { value: o.value, text: o.text, selected: o.value === selected }));
    });
    return sel;
  }
  function monthChoices(skip) {
    var wm = workMonth().key, out = [];
    for (var n = -6; n <= 2; n++) {
      var key = addMonths(wm, n);
      if (skip && skip.indexOf(key) !== -1) continue;
      out.push({ value: key, text: monthLabel(key, true) + (key === wm ? ' (last month)' : '') });
    }
    return out;
  }

  // ---------- Add client ----------
  function openAddClient() {
    var business = el('input', { type: 'text', maxLength: 200, placeholder: 'e.g. Smith Consulting LLC', required: true });
    var name = el('input', { type: 'text', maxLength: 200, placeholder: 'e.g. Jane Smith' });
    var accountant = accountantSelect('');
    var stage = stageSelect(restartStage());
    var monthSel = monthSelect(workMonth().key, true);
    var recur = recurControls(true, 1);
    var notes = el('textarea', { placeholder: 'Anything worth remembering about this client…' });
    var createBtn = el('button', { class: 'btn primary', type: 'button', text: 'Add Client' });
    var businessField = field('Business Name', business, 'f-biz', true);

    business.addEventListener('input', function () {
      if (business.value.trim()) businessField.classList.remove('invalid');
    });

    function create() {
      if (createBtn.disabled) return;
      if (!business.value.trim()) {
        businessField.classList.add('invalid');
        business.focus();
        return;
      }
      var biz = business.value.trim();
      var existing = findClientByName(biz);
      if (existing) {
        ask({ title: 'Client already exists', okText: 'Open ' + existing.business,
          message: existing.business + ' is already a client, with its own checklist items and notes.\n\n' +
            'Open it instead? From there, "+ Add a month" puts it back on the board.' })
          .then(function (ok) {
            if (!ok) return;
            closeModal(true);
            openExisting(existing);
          });
        return;
      }
      createBtn.disabled = true;
      createBtn.textContent = 'Adding…';
      send('addClient', {
        business: biz,
        name: name.value.trim(),
        accountant: accountant.value === '__new' ? '' : accountant.value,
        stage: stage.value,
        month: monthSel.value,
        monthly: recur.box.checked,
        recurDay: +recur.daySel.value,
        note: notes.value
      }).then(function () {
        closeModal(true);
        toast(biz + ' added');
      }, function () {
        createBtn.disabled = false;
        createBtn.textContent = 'Add Client';
      });
    }
    createBtn.addEventListener('click', create);
    [business, name].forEach(function (i) {
      i.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
    });

    openModal({
      title: 'Add Client',
      focus: business,
      body: [
        el('div', { class: 'row' },
          businessField,
          field('Client / Contact Name', name, 'f-name')
        ),
        el('div', { class: 'row' },
          field('Accountant', accountant, 'f-acc'),
          field('Starting Stage', stage, 'f-stage')
        ),
        field('Month to start with', monthSel, 'f-month'),
        recur.node,
        field('Notes', notes, 'f-notes'),
        el('p', { class: 'hint', text: 'Notes are saved with today\'s date and your name. You can add more dated notes later.' })
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { closeModal(true); } }),
        createBtn
      ]
    });
  }

  // ---------- View / edit client ----------
  // Opens a client from one of its month cards, or (with cardId null) a client
  // that has no month on the board right now.
  function openClient(cardId, clientId) {
    var found = cardId ? cardById(cardId) : null;
    if (!found) {
      var only = clientId && clientById(clientId);
      if (!only) return;
      found = { c: only, k: null };
      cardId = null;
    }
    var start = found.c, id = start.id;
    function cur() { return clientById(id); }
    function curCard() {
      var c = cur();
      if (!c || !cardId) return null;
      for (var i = 0; i < c.cards.length; i++) if (c.cards[i].id === cardId) return c.cards[i];
      return null;
    }
    function titleText(biz) {
      var k = curCard();
      return biz + (k && k.month ? ' · ' + monthLabel(k.month, true) : '');
    }

    var business = el('input', { type: 'text', maxLength: 200, value: start.business, required: true });
    var name = el('input', { type: 'text', maxLength: 200, value: start.name });
    var businessField = field('Business Name', business, 'e-biz', true);
    var accountant = accountantSelect(start.accountant, function (v) {
      send('updateClient', { id: id, accountant: v }, function () { cur().accountant = v; });
    });
    var stage = stageSelect(found.k ? found.k.stage : restartStage());
    var recur = recurControls(start.monthly, start.recurDay, function (change) {
      var args = { id: id };
      Object.keys(change).forEach(function (k) { args[k] = change[k]; });
      send('updateClient', args, function () {
        var c = cur();
        if ('monthly' in change) c.monthly = change.monthly;
        if ('recurDay' in change) c.recurDay = change.recurDay;
      });
    });
    var sinceText = el('p', { class: 'hint' });
    var noteInput = el('textarea', { placeholder: 'Write an update… (saved with today\'s date and your name)' });
    var notesList = el('ul', { class: 'notes' });
    var historyList = el('ul', { class: 'history' });

    // Typing in the name fields is saved shortly after you stop typing.
    var edits = {}, editTimer = null;
    function queueEdit(key, value) {
      edits[key] = value;
      clearTimeout(editTimer);
      editTimer = setTimeout(flushEdits, 800);
    }
    function flushEdits() {
      clearTimeout(editTimer);
      if (!Object.keys(edits).length || !cur()) return;
      var args = { id: id }, pendingEdits = edits;
      edits = {};
      Object.keys(pendingEdits).forEach(function (k) { args[k] = pendingEdits[k]; });
      send('updateClient', args, function () {
        var c = cur();
        Object.keys(pendingEdits).forEach(function (k) { c[k] = pendingEdits[k]; });
      });
    }

    business.addEventListener('input', function () {
      var v = business.value.trim();
      businessField.classList.toggle('invalid', !v);
      if (!v) { delete edits.business; return; } // keep the saved name until a new one is typed
      if (currentModal) currentModal.titleEl.textContent = titleText(v);
      queueEdit('business', v);
    });
    name.addEventListener('input', function () { queueEdit('name', name.value.trim()); });
    [business, name].forEach(function (i) { i.addEventListener('blur', flushEdits); });

    stage.addEventListener('change', function () {
      var v = stage.value;
      if (v === curCard().stage) return;
      send('moveCard', { id: cardId, stage: v }, function () { localMove(cur(), curCard(), v); });
      toast('Moved to ' + v);
    });

    function refreshSince() {
      var c = cur(), k = curCard();
      if (!k) {
        sinceText.textContent = 'Client added ' + fmtDate(c.createdAt) + '.' +
          (c.updatedBy ? ' Last changed by ' + shortName(c.updatedBy) + '.' : '');
        return;
      }
      var d = daysSince(k.enteredAt);
      sinceText.textContent = (k.month ? monthLabel(k.month, true) + ' has been' : 'In this stage') + ' in "' + k.stage +
        '" since ' + fmtDate(k.enteredAt) + ' (' + (d === 0 ? 'today' : daysLabel(d)) + '). Client added ' +
        fmtDate(c.createdAt) + '.' + (c.updatedBy ? ' Last changed by ' + shortName(c.updatedBy) + '.' : '');
    }

    // ---------- This client's months on the board ----------
    var monthsList = el('ul', { class: 'months-list' });
    function refreshMonths() {
      var c = cur();
      monthsList.textContent = '';
      if (!boardCards(c).length) {
        monthsList.appendChild(el('li', { class: 'muted', text: 'Not on the board right now. Use "+ Add a month" to put a month on the board.' }));
      }
      boardCards(c).forEach(function (k) {
        var isThis = k.id === cardId;
        monthsList.appendChild(el('li', { class: isThis ? 'current' : '' },
          el('strong', { text: k.month ? monthLabel(k.month, true) : 'No particular month' }),
          el('span', { class: 'muted', text: k.stage }),
          el('span', { class: 'spacer' }),
          isThis ? el('span', { class: 'muted', text: 'Open now' })
            : el('button', { class: 'btn small', type: 'button', text: 'Open', onclick: function () {
                closeModal();
                openClient(k.id);
              } })
        ));
      });
    }
    function addMonth() {
      var c = cur();
      var onBoard = boardCards(c).map(function (k) { return k.month; });
      var choices = monthChoices(onBoard);
      if (!choices.length) { toast('All nearby months are already on the board.'); return; }
      var latest = onBoard.filter(Boolean).sort().pop();
      var suggested = latest ? addMonths(latest, 1) : workMonth().key;
      ask({ title: 'Add a month', okText: 'Add to Board', options: choices,
        value: choices.some(function (o) { return o.value === suggested; }) ? suggested : choices[choices.length - 1].value,
        message: 'Put another month for ' + displayName(c) + ' on the board. It starts in "' + restartStage() + '".' })
        .then(function (month) {
          if (!month) return;
          send('addCard', { clientId: id, month: month }).then(function () {
            toast(monthLabel(month, true) + ' added to the board');
            // Opened from the Clients list with no month: switch to the new card.
            if (!cardId && currentModal && cur()) {
              var added = cur().cards.filter(function (k) { return k.month === month && k.onBoard; })[0];
              if (added) { closeModal(); openClient(added.id); }
            }
          });
        });
    }

    function refreshNotes() {
      var c = cur();
      notesList.textContent = '';
      if (!c.notes.length) {
        notesList.appendChild(el('li', { class: 'muted', text: 'No notes yet.' }));
        return;
      }
      c.notes.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (n) {
        var isTemp = /^tmp-/.test(n.id);
        notesList.appendChild(el('li', { class: 'note' + (n.author === 'Automatic' ? ' auto' : '') + (isTemp ? ' pending' : '') },
          el('div', { class: 'note-head' },
            el('span', { title: n.author || '' },
              fmtDateTime(n.date) + (n.author ? ' · ' + (n.author === 'Automatic' ? 'Automatic' : shortName(n.author)) : '')),
            isTemp ? el('span', { text: 'Saving…' }) : el('button', { class: 'note-del', type: 'button', text: 'Delete', onclick: function () {
              ask({ title: 'Delete note?', message: 'Delete this note from ' + fmtDateTime(n.date) + '?', okText: 'Delete', danger: true })
                .then(function (ok) {
                  if (!ok) return;
                  send('deleteNote', { id: n.id }, function () {
                    var cc = cur();
                    cc.notes = cc.notes.filter(function (x) { return x.id !== n.id; });
                  });
                });
            } })
          ),
          el('div', { class: 'note-text', text: n.text })
        ));
      });
    }

    function refreshHistory() {
      historyList.textContent = '';
      var items = cur().history.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (!items.length) {
        historyList.appendChild(el('li', { class: 'muted', text: 'No stage changes recorded yet.' }));
        return;
      }
      items.forEach(function (h) {
        historyList.appendChild(el('li', {},
          el('span', { text: (h.month ? monthLabel(h.month) + ': ' : '') + h.stage + (h.auto ? ' (added automatically)' : '') }),
          el('span', { class: 'muted', text: fmtDateTime(h.date) + (h.by && !h.auto ? ' · ' + shortName(h.by) : '') })
        ));
      });
    }

    function saveNote() {
      var text = noteInput.value.trim();
      if (!text) return false;
      noteInput.value = '';
      send('addNote', { clientId: id, text: text }, function () {
        cur().notes.push({ id: uid(), date: nowISO(), author: state.me, text: text });
      });
      return true;
    }

    var addNoteBtn = el('button', { class: 'btn primary small', type: 'button', text: 'Add Note', onclick: function () {
      if (!saveNote()) noteInput.focus();
    } });
    noteInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addNoteBtn.click();
    });

    // ---------- Monthly checklist ----------
    var thisYear = new Date().getFullYear();
    var year = cardMonth(found.k).year;
    var editingTasks = false;
    var yearLabel = el('span', { class: 'year' });
    var prevYearBtn = el('button', { class: 'btn icon small', type: 'button', text: '‹', 'aria-label': 'Previous year',
      onclick: function () { year--; renderChecklist(); } });
    var nextYearBtn = el('button', { class: 'btn icon small', type: 'button', text: '›', 'aria-label': 'Next year',
      onclick: function () { year++; renderChecklist(); } });
    var editTasksBtn = el('button', { class: 'btn small', type: 'button', text: 'Edit items', onclick: function () {
      editingTasks = !editingTasks;
      renderChecklist();
    } });
    // The checklist normally shows just the card's month; "Whole year" shows
    // the Jan–Dec grid. The choice is remembered on this computer.
    var VIEW_KEY = 'bookkeeping-tracker-checklist-view';
    var wholeYear = false;
    try { wholeYear = localStorage.getItem(VIEW_KEY) === 'year'; } catch (e) { /* ignore */ }
    var monthTitle = el('span', { class: 'month-title' });
    var yearNav = el('span', { class: 'year-nav' }, prevYearBtn, yearLabel, nextYearBtn);
    var viewBtn = el('button', { class: 'btn small', type: 'button', onclick: function () {
      wholeYear = !wholeYear;
      year = cardMonth(curCard()).year;
      try { localStorage.setItem(VIEW_KEY, wholeYear ? 'year' : 'month'); } catch (e) { /* ignore */ }
      renderChecklist();
    } });
    var tableWrap = el('div');
    var taskEditor = el('div');

    function toggleCheck(taskId, month, done) {
      var y = +month.slice(0, 4);
      send('toggleCheck', { clientId: id, taskId: taskId, month: month, done: done }, function () {
        var map = checksFor(cur(), y);
        if (!map) return;
        if (done) map[taskId + '|' + month] = [state.me, nowISO()];
        else delete map[taskId + '|' + month];
      });
    }

    function useTemplate() {
      send('applyTemplate', { clientId: id }, function () {
        var c = cur();
        state.template.forEach(function (name) {
          var have = c.tasks.some(function (t) { return t.name.toLowerCase() === name.toLowerCase(); });
          if (!have) c.tasks.push({ id: uid(), name: name });
        });
      });
    }

    function renderTable() {
      var c = cur();
      var wm = cardMonth(curCard());
      if (!wholeYear) year = wm.year;
      tableWrap.textContent = '';
      yearLabel.textContent = year;
      nextYearBtn.disabled = year >= thisYear;
      yearNav.hidden = !wholeYear;
      viewBtn.textContent = wholeYear ? 'Just ' + MONTH_LONG[wm.index] : 'Whole year';
      editTasksBtn.textContent = editingTasks ? 'Done editing' : 'Edit items';
      monthTitle.textContent = '';
      if (!c.tasks.length) {
        tableWrap.appendChild(el('div', { class: 'checklist-wrap' }, el('div', { class: 'checklist-empty' },
          el('div', { text: 'This client doesn\'t have a checklist yet.' }),
          state.template.length
            ? el('button', { class: 'btn primary small', type: 'button', onclick: useTemplate,
                text: 'Start from the Checklist Template (' + state.template.length + ' items)' })
            : null,
          el('div', { class: 'muted', style: 'margin-top:8px', text: 'Or click "Edit items" to add this client\'s accounts and tasks.' })
        )));
        return;
      }
      var checks = checksFor(c, year);
      if (!checks) {
        tableWrap.appendChild(el('div', { class: 'checklist-wrap' }, el('div', { class: 'checklist-empty', text: 'Loading ' + year + '…' })));
        var wanted = year;
        call('getChecklistYear', id, wanted).then(function (json) {
          olderChecks[id + '|' + wanted] = JSON.parse(json);
          if (year === wanted && cur()) renderTable();
        }, showError);
        return;
      }
      var doneNow = c.tasks.filter(function (t) { return checks[t.id + '|' + wm.key]; }).length;
      monthTitle.textContent = MONTH_LONG[wm.index] + ' ' + wm.year + ' · ' + doneNow + ' of ' + c.tasks.length + ' done';
      if (!wholeYear) { renderMonthList(c, checks, wm); return; }
      var head = el('tr', {}, el('th', { class: 'task', scope: 'col', text: 'Item' }));
      MONTH_SHORT.forEach(function (label, mi) {
        var key = monthKey(year, mi);
        var done = c.tasks.filter(function (t) { return checks[t.id + '|' + key]; }).length;
        head.appendChild(el('th', {
          scope: 'col',
          class: (key === wm.key ? 'work' : '') + (done === c.tasks.length ? ' full' : ''),

            if (!ok) return;

            });

        !cardId ? null : el('button', { class: 'btn', type: 'button', text: 'Remove this month from board', onclick: function () {
          var k = curCard();
          var label = k.month ? monthLabel(k.month, true) : 'This card';
          ask({ title: 'Remove from board?', okText: 'Remove', danger: true,
            message: 'Take ' + label + ' for ' + displayName(cur()) + ' off the board?\n\nThe client, checklist and notes stay. ' +
              'You can put it back with "+ Add a month".' }).then(function (ok) {

          });

        el('span', { class: 'muted', text: 'Changes save automatically' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ],

      },

      }
    });
    var savedTab = 'details';
    try { savedTab = localStorage.getItem(TAB_KEY) === 'checklist' ? 'checklist' : 'details'; } catch (e) { /* ignore */ }

                .then(function (ok) {

  // ---------- Checklist template ----------
  function openTemplate() {
    var list = el('ul', { class: 'list-edit' });
    var newName = el('input', { type: 'text', placeholder: 'New item, e.g. "Checking"', maxLength: 100, 'aria-label': 'New template item' });
    var applyBox = el('div');

    function save(next) {
      send('setTemplate', { tasks: next }, function () { state.template = next; });
    }

    function refresh() {
      var without = state.clients.filter(function (c) { return !c.tasks.length; }).length;
      applyBox.textContent = '';
      if (without && state.template.length) {
        applyBox.appendChild(el('div', { class: 'setting' },
          el('span', { text: without + (without === 1 ? ' client doesn\'t' : ' clients don\'t') + ' have a checklist yet.' }),
          el('button', { class: 'btn primary small', type: 'button', text: 'Give them this checklist', onclick: function () {
            send('applyTemplateAll', {}).then(function (json) {
              var r = JSON.parse(json).result || {};
              toast('Checklist added to ' + (r.clients || 0) + ' clients');
            });
          } })
        ));
      }
      if (list.contains(document.activeElement)) return;
      list.textContent = '';
      if (!state.template.length) list.appendChild(el('li', { class: 'muted', text: 'No items yet. Add them below.' }));
      state.template.forEach(function (name, i) {
        var input = el('input', { type: 'text', value: name, maxLength: 100, 'aria-label': 'Template item' });
        input.addEventListener('change', function () {
          var to = input.value.trim();
          if (!to || to === name) { input.value = name; return; }
          save(state.template.map(function (x, k) { return k === i ? to : x; }));
        });
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
        function move(dir) {
          var next = state.template.slice(), j = i + dir;
          next[i] = next[j];
          next[j] = name;
          save(next);
        }
        list.appendChild(el('li', { class: 'list-row' },
          el('button', { class: 'btn icon small', type: 'button', text: '↑', title: 'Move up', 'aria-label': 'Move ' + name + ' up',
            disabled: i === 0, onclick: function () { move(-1); } }),
          el('button', { class: 'btn icon small', type: 'button', text: '↓', title: 'Move down', 'aria-label': 'Move ' + name + ' down',
            disabled: i === state.template.length - 1, onclick: function () { move(1); } }),
          input,
          el('button', { class: 'btn icon small danger', type: 'button', text: '✕', title: 'Remove', 'aria-label': 'Remove ' + name,
            onclick: function () { save(state.template.filter(function (x, k) { return k !== i; })); } })
        ));
      });
    }

    function add() {
      var n = newName.value.trim();
      if (!n) { newName.focus(); return; }
      newName.value = '';
      var exists = state.template.some(function (x) { return x.toLowerCase() === n.toLowerCase(); });
      if (!exists) save(state.template.concat([n]));
      newName.focus();
    }
    newName.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });

    refresh();
    openModal({
      title: 'Checklist Template',

        applyBox,
        list,

        el('div', { class: 'spacer' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ]
    });
