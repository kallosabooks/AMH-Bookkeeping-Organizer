  // ---------- Edit stages ----------
  function openStages() {
    var list = el('ul', { class: 'list-edit' });
    var newName = el('input', { type: 'text', placeholder: 'New stage name', maxLength: 100, 'aria-label': 'New stage name' });
    var restartSel = el('select', { id: 'restart-stage' });
    restartSel.addEventListener('change', function () {
      var v = restartSel.value;
      send('setRestartStage', { name: v }, function () { state.restartStage = v; });
    });

    function refresh() {
      if (document.activeElement !== restartSel) fillStageSelect(restartSel, restartStage());
      if (list.contains(document.activeElement)) return;
      list.textContent = '';
      state.stages.forEach(function (s, i) {
        var count = countIn(s);
        var input = el('input', { type: 'text', value: s, maxLength: 100, 'aria-label': 'Stage name' });
        input.addEventListener('change', function () {
          var to = input.value.trim();
          if (!to || to === s) { input.value = s; return; }
          send('renameStage', { from: s, to: to }, function () {
            state.stages = state.stages.map(function (x) { return x === s ? to : x; });
            state.clients.forEach(function (c) { c.cards.forEach(function (k) { if (k.stage === s) k.stage = to; }); });
            if (state.restartStage === s) state.restartStage = to;
            if (sortPrefs[s]) setSort(to, sortPrefs[s]);
          });
        });
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
        list.appendChild(el('li', { class: 'list-row' },
          el('button', { class: 'btn icon small', type: 'button', title: 'Move left', 'aria-label': 'Move ' + s + ' earlier',
            text: '↑', disabled: i === 0, onclick: function () { moveStage(s, -1); } }),
          el('button', { class: 'btn icon small', type: 'button', title: 'Move right', 'aria-label': 'Move ' + s + ' later',
            text: '↓', disabled: i === state.stages.length - 1, onclick: function () { moveStage(s, 1); } }),
          input,
          el('span', { class: 'n', text: count + (count === 1 ? ' client' : ' clients') }),
          el('button', { class: 'btn icon small danger', type: 'button', title: 'Remove stage', 'aria-label': 'Remove ' + s,
            text: '✕', disabled: state.stages.length === 1, onclick: function () { removeStage(s); } })
        ));
      });
    }

    function moveStage(s, dir) {
      send('moveStage', { name: s, dir: dir }, function () {
        var i = state.stages.indexOf(s), j = i + dir;
        if (i < 0 || j < 0 || j >= state.stages.length) return;
        state.stages[i] = state.stages[j];
        state.stages[j] = s;
      });
    }

    function removeStage(s) {
      var i = state.stages.indexOf(s);
      var fallback = state.stages[i > 0 ? i - 1 : 1];
      var count = countIn(s);
      var msg = 'Remove the stage "' + s + '"?' +
        (count ? '\n\nIts ' + count + (count === 1 ? ' card' : ' cards') + ' will be moved to "' + fallback + '".' : '') +
        (s === restartStage() ? '\n\nMonthly clients will restart in "' + fallback + '" instead.' : '');
      ask({ title: 'Remove stage?', message: msg, okText: 'Remove', danger: true }).then(function (ok) {
        if (!ok) return;
        send('removeStage', { name: s }, function () {
          state.clients.forEach(function (c) { c.cards.forEach(function (k) { if (k.stage === s) localMove(c, k, fallback); }); });
          state.stages = state.stages.filter(function (x) { return x !== s; });
          if (state.restartStage === s) state.restartStage = fallback;
        });
      });
    }

    function addStage() {
      var n = newName.value.trim();
      if (!n) { newName.focus(); return; }
      newName.value = '';
      send('addStage', { name: n }, function () { state.stages.push(n); });
      boardEl.scrollLeft = boardEl.scrollWidth;
      newName.focus();
    }
    newName.addEventListener('keydown', function (e) { if (e.key === 'Enter') addStage(); });

    refresh();
    openModal({
      title: 'Edit Stages',
      focus: newName,
      refresh: refresh,
      body: [
        el('div', { class: 'setting' },
          el('label', { for: 'restart-stage', text: 'Monthly clients restart in:' }),
          restartSel
        ),
        el('p', { class: 'muted', style: 'margin-top:0', text: 'Changes here affect everyone. Rename a stage by editing its name. Use the arrows to change the order (top = leftmost column).' }),
        list,
        el('div', { class: 'list-add' },
          newName,
          el('button', { class: 'btn primary', type: 'button', text: 'Add Stage', onclick: addStage })
        )
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: function () { closeModal(); } })
      ]
    });
  }

  // ======================================================================
  // Backup & restore
  // ======================================================================
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: filename, target: '_self' });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function stamp() { return isoDay(nowISO()); }

  function exportJSON() {
    toast('Preparing the backup…');
    call('exportAll').then(function (json) {
      download('bookkeeping-backup-' + stamp() + '.json', JSON.stringify(JSON.parse(json), null, 2), 'application/json');
      toast('Backup downloaded');
    }, showError);
  }

  var CSV_HEADERS = ['Business Name', 'Client Name', 'Accountant', 'Month', 'Stage', 'Monthly', 'Monthly Day',
    'Entered Stage', 'Client Added', 'Notes'];

  function csvCell(v) {
    v = str(v);
    // Stop spreadsheet programs from treating text like "=..." as a formula.
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return /[",\r\n]/.test(v) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function exportCSV() {
    var rows = [CSV_HEADERS];
    // One row per card on the board; a client's notes go on its first row only.
    var notesDone = {};
    state.stages.forEach(function (s) {
      entriesIn(s).forEach(function (e) {
        var c = e.c, k = e.k;
        var notes = notesDone[c.id] ? '' : c.notes.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })
          .map(function (n) { return '[' + isoDayTime(n.date) + '] ' + n.text; }).join('\n');
        notesDone[c.id] = true;
        rows.push([c.business, c.name, c.accountant, k.month, s, c.monthly ? 'Yes' : 'No', c.recurDay,
          isoDay(k.enteredAt), isoDay(c.createdAt), notes]);
      });
    });
    var text = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    download('bookkeeping-clients-' + stamp() + '.csv', text, 'text/csv');
    toast('CSV downloaded');
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else inQuotes = false;
        } else cell += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ''; }); });
  }

  function parseLocalDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(str(s).trim());
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 12), +(m[5] || 0)).toISOString();
    return validDate(s);
  }

  function parseNotes(text) {
    var notes = [];
    str(text).split(/\r?\n/).forEach(function (line) {
      var m = /^\[(\d{4}-\d{2}-\d{2}(?: \d{1,2}:\d{2})?)\]\s?(.*)$/.exec(line);
      if (m) notes.push({ date: parseLocalDate(m[1]) || nowISO(), text: m[2] });
      else if (notes.length) notes[notes.length - 1].text += '\n' + line;
      else if (line.trim()) notes.push({ date: nowISO(), text: line });
    });
    return notes.filter(function (n) { return n.text.trim(); });
  }

  function payloadFromCSV(text) {
    var rows = parseCSV(text);
    if (rows.length < 1) throw new Error('The CSV file is empty.');
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    function col(name) { return header.indexOf(name.toLowerCase()); }
    var iBiz = col('Business Name'), iName = col('Client Name'), iAcc = col('Accountant'), iStage = col('Stage'),
        iMonthly = col('Monthly'), iDay = col('Monthly Day'), iMonth = col('Month'),
        iEntered = col('Entered Stage'), iAdded = col('Client Added'), iNotes = col('Notes');
    if (iBiz === -1 && iName === -1) throw new Error('Could not find a "Business Name" column.');

    var stages = state.stages.slice(), accountants = state.accountants.slice();
    function addName(list, n) {
      for (var i = 0; i < list.length; i++) if (list[i].toLowerCase() === n.toLowerCase()) return list[i];
      list.push(n);
      return n;
    }
    // Rows for the same business become one client with several month cards.
    var clients = [], byName = {};
    rows.slice(1).forEach(function (r) {
      function get(i) { return i === -1 ? '' : str(r[i]).trim().replace(/^'(?=[=+\-@])/, ''); }
      var business = get(iBiz) || get(iName);
      if (!business) return;
      var entered = parseLocalDate(get(iEntered)) || nowISO();
      var month = (/^\d{4}-\d{1,2}$/.test(get(iMonth)) ? get(iMonth) : '');
      if (month) month = month.slice(0, 5) + pad(+month.slice(5));
      var stage = get(iStage) ? addName(stages, get(iStage)) : stages[0];
      var c = byName[business.toLowerCase()];
      if (!c) {
        c = byName[business.toLowerCase()] = {
          business: business,
          name: get(iBiz) ? get(iName) : '',
          accountant: get(iAcc) ? addName(accountants, get(iAcc)) : '',
          monthly: /^(y|yes|true|1|x)$/i.test(get(iMonthly)),
          recurDay: clampDay(get(iDay)),
          createdAt: parseLocalDate(get(iAdded)) || entered,
          notes: [], history: [], cards: []
        };
        clients.push(c);
      }
      if (iNotes !== -1) c.notes = c.notes.concat(parseNotes(r[iNotes]));
      c.cards.push({ month: month, stage: stage, enteredAt: entered, onBoard: true });
      c.history.push({ stage: stage, date: entered, month: month });
    });
    return { stages: stages, accountants: accountants, restartStage: state.restartStage, clients: clients };
  }

  // Accepts backups from this shared version and from the single-computer version.
  function payloadFromJSON(d) {
    if (d && d.app === 'bookkeeping-tracker-shared') {
      if (!Array.isArray(d.stages) || !Array.isArray(d.clients)) throw new Error('This backup file is damaged.');
      return { stages: d.stages, accountants: d.accountants || [], restartStage: d.restartStage,
        template: d.template, clients: d.clients };
    }
    if (!d || !Array.isArray(d.stages) || !Array.isArray(d.clients)) {
      throw new Error('This file does not look like a tracker backup.');
    }
    var stageName = {}, accName = {};
    d.stages.forEach(function (s) { if (s) stageName[s.id] = str(s.name); });
    (d.accountants || []).forEach(function (a) { if (a) accName[a.id] = str(a.name); });
    var stages = d.stages.map(function (s) { return s && str(s.name); }).filter(Boolean);
    return {
      stages: stages,
      accountants: (d.accountants || []).map(function (a) { return a && str(a.name); }).filter(Boolean),
      restartStage: (d.settings && stageName[d.settings.recurStageId]) || stages[0],
      clients: d.clients.filter(Boolean).map(function (c) {
        return {
          business: str(c.business) || str(c.name),
          name: c.business ? str(c.name) : '',
          accountant: accName[c.accountantId] || '',
          stage: stageName[c.stageId] || stages[0],
          monthly: !!c.monthly,
          recurDay: clampDay(c.recurDay),
          lastRecurAt: c.lastRecurAt || '',
          enteredAt: c.stageEnteredAt,
          createdAt: c.createdAt,
          notes: (c.notes || []).map(function (n) { return { date: n.date, text: n.text, author: '' }; }),
          history: (c.stageHistory || []).map(function (h) {
            return { stage: stageName[h.stageId] || h.stageName || '', date: h.date, auto: !!h.auto, by: '' };
          })
        };
      })
    };
  }

  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result).replace(/^﻿/, '');
      var isJSON = /\.json$/i.test(file.name) || /^\s*[\{\[]/.test(text);
      var payload;
      try {
        payload = isJSON ? payloadFromJSON(JSON.parse(text)) : payloadFromCSV(text);
      } catch (err) {
        ask({ title: 'Could not import', message: '"' + file.name + '"\n\n' + errText(err), okText: 'OK' });
        return;
      }
      var n = payload.clients.length;
      ask({
        title: 'Replace the board?',
        danger: true,
        okText: 'Replace Everything',
        message: 'Import ' + n + (n === 1 ? ' client' : ' clients') + ' from "' + file.name + '"?\n\n' +
          'This REPLACES all clients' + (isJSON ? ', stages and accountants' : '') +
          ' for everyone on your team. Download a backup first if you are not sure.' +
          (isJSON ? '' : '\n\nCSV files don\'t include checklist items or checkmarks, so clients will start from the ' +
            'Checklist Template again. To keep them, restore from a JSON backup instead.')
      }).then(function (ok) {
        if (!ok) return;
        closeModal(true);
        setStatus('Importing…');
        send('importAll', { data: payload }).then(function () {
          toast('Imported ' + n + ' clients');
        });
      });
    };
    reader.onerror = function () { toast('Could not read that file.', true); };
    reader.readAsText(file);
  }

  var fileInput = document.getElementById('importFile');
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) importFile(fileInput.files[0]);
    fileInput.value = '';
  });

  function importFromWorkbook(urlInput, yearSel, btn) {
    var url = urlInput.value.trim();
    if (!url) { urlInput.focus(); return; }
    btn.disabled = true;
    btn.textContent = 'Importing… (this can take a minute)';
    send('importChecklists', { url: url, year: +yearSel.value }).then(function (json) {
      btn.disabled = false;
      btn.textContent = 'Import Checklists';
      var r = JSON.parse(json).result || {};
      function n(count, word) { return count + ' ' + word + (count === 1 ? '' : 's'); }
      var created = r.created || [], matched = r.matched || [];
      var lines = [
        'Read ' + n(r.tabs, 'checklist tab') + '.',
        n(matched.length, 'tab') + ' matched a client already on the board.',
        n(created.length, 'new client') + ' added to "' + restartStage() + '"' + (created.length ? ': ' + created.join(', ') : '') + '.',
        'Added ' + n(r.tasks, 'checklist item') + ', ' + n(r.checks, 'checkmark') + ' for ' + yearSel.value + ', and ' + n(r.notes, 'note') + '.'
      ];
      if (r.template) lines.push('The Checklist Template was set from the template tab (' + r.template + ' items).');
      if ((r.skipped || []).length) lines.push('Skipped (not a checklist): ' + r.skipped.join(', ') + '.');
      closeModal(true);
      ask({ title: 'Import finished', message: lines.join('\n\n'), okText: 'OK' });
    }, function () {
      btn.disabled = false;
      btn.textContent = 'Import Checklists';
    });
  }

  function openBackup() {
    var thisYear = new Date().getFullYear();
    var urlInput = el('input', { type: 'text', placeholder: 'Paste the link to your checklist Google Sheet', 'aria-label': 'Google Sheet link' });
    var yearSel = el('select', { 'aria-label': 'Year the checkmarks are for' });
    [thisYear, thisYear - 1, thisYear - 2].forEach(function (y) {
      yearSel.appendChild(el('option', { value: String(y), text: 'Checkmarks are for ' + y, selected: y === workMonth().year }));
    });
    var importBtn = el('button', { class: 'btn primary', type: 'button', text: 'Import Checklists' });
    importBtn.addEventListener('click', function () { importFromWorkbook(urlInput, yearSel, importBtn); });
    openModal({
      title: 'Backup & Restore',
      body: [
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Your data' }),
          el('p', { text: 'Everything is stored in your team\'s Google Sheet. Google keeps its version history (File → Version history), so you can see or restore earlier versions there too.' }),
          el('div', { class: 'btns' },
            state.sheetUrl ? el('a', { class: 'btn', href: state.sheetUrl, target: '_blank', rel: 'noopener', text: 'Open the Google Sheet' }) : null
          )
        ),
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Export' }),
          el('p', { text: 'JSON is a complete backup (stages, accountants, clients, all dated notes and stage history). CSV opens in Excel or Google Sheets.' }),
          el('div', { class: 'btns' },
            el('button', { class: 'btn primary', type: 'button', text: 'Download Backup (JSON)', onclick: exportJSON }),
            el('button', { class: 'btn', type: 'button', text: 'Download Spreadsheet (CSV)', onclick: exportCSV })
          )
        ),
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Import checklists from an existing Google Sheet' }),
          el('p', { text: 'For a workbook with one tab per client (business name at the top, tasks down the side, Jan–Dec checkboxes). Tabs are matched to clients by business name, and new clients are added. A tab with "template" in its name becomes the Checklist Template. Additional notes are copied too. Running it again only adds what is missing.' }),
          el('div', { class: 'import-form' }, urlInput, yearSel, importBtn)
        ),
        el('div', { class: 'backup-block' },
          el('h3', { text: 'Import' }),
          el('p', { text: 'Restore from a JSON backup or CSV file, including a backup downloaded from the single-computer version of this tracker. Importing replaces the board for everyone (you will be asked to confirm).' }),
          el('div', { class: 'btns' },
            el('button', { class: 'btn', type: 'button', text: 'Choose File to Import…', onclick: function () { fileInput.click(); } })
          )
        )
      ],
      footer: [
        el('div', { class: 'spacer' }),
        el('button', { class: 'btn', type: 'button', text: 'Close', onclick: function () { closeModal(); } })
      ]
    });
  }

  // ======================================================================
  // Start
  // ======================================================================
  document.getElementById('addClientBtn').addEventListener('click', openAddClient);
  document.getElementById('clientsBtn').addEventListener('click', openClients);
  document.getElementById('accountantsBtn').addEventListener('click', openAccountants);
  document.getElementById('templateBtn').addEventListener('click', openTemplate);
  document.getElementById('stagesBtn').addEventListener('click', openStages);
  document.getElementById('backupBtn').addEventListener('click', openBackup);

  refresh();
  // Keep "days in stage" current if the page stays open overnight.
  setInterval(function () { if (!drag && !currentModal) render(); }, 60 * 60 * 1000);
})();
</script>
</body>
